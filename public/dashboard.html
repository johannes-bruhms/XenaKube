<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XenaKube</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #1e1e2e;
    --text: #c8c8d8;
    --dim: #555568;
    --accent: #00ff88;
    --accent2: #00ccff;
    --warm: #ff6644;
    --gold: #ffcc00;
    --active-glow: rgba(0, 255, 136, 0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    position: relative;
  }

  /* Full-viewport cube canvas — background layer */
  #cube-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    z-index: 0;
  }

  /* Overlay panels — transparent backgrounds over cube */
  .ovl {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  .ovl > * { pointer-events: auto; }

  .ovl-tl { top: 16px; left: 20px; width: 480px; max-height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; scrollbar-width: none; font-size: 22px; }
  .ovl-tl::-webkit-scrollbar { display: none; }
  .ovl-tc { top: 16px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 60vw; pointer-events: none; }
  .ovl-tr { top: 16px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* Size tweaks: top-left column children shrunk to 50%; right-side controls enlarged 50% */
  .ovl-tl .ovl-section,
  .ovl-tl .mode-row,
  .ovl-tl .active-cards { zoom: 0.5; }

  /* Bottom-left overlay — state + expression panels stacked naturally
   * above the piano-roll. Key decisions:
   *   • Wrapper is position: fixed (bottom-anchored above sieve strip),
   *     NO zoom — Chrome's `zoom` scales `bottom` on fixed elements,
   *     which would pull the wrapper into the sieve strip.
   *   • Each child carries its own `zoom: 0.5` while sitting in natural
   *     flex flow (not position: fixed). This sidesteps the
   *     zoom+position:fixed containing-block quirk that caused the
   *     earlier "title overlaps top row" bug.
   *   • Adding/removing state rows just grows the wrapper upward — no
   *     magic-number bottom anchors. */
  .ovl-bl {
    position: fixed;
    left: 20px;
    bottom: 110px;            /* clears the piano-roll strip (~90px) with padding */
    width: 480px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 240px);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .ovl-bl::-webkit-scrollbar { display: none; }
  .ovl-bl .state-rows,
  .ovl-bl .expression-panel { zoom: 0.5; }
  .ovl-bl .state-rows { display: flex; flex-direction: column; gap: 4px; }
  .ovl-tr .cube-rotate-ctrl { zoom: 1.5; }
  .ovl-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2; padding: 6px 12px 10px; pointer-events: none; }
  .ovl-section { display: flex; flex-direction: column; gap: 6px; }

  h1.title {
    font-size: 60px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
  }
  .conn-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    margin-top: 8px;
  }
  .conn-row input {
    padding: 7px 12px;
    font-size: 22px;
    width: 360px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: rgba(10, 10, 15, 0.5);
    color: var(--warm);
    font-family: monospace;
    letter-spacing: 1px;
  }
  .conn-row button, .ctrl-btn {
    padding: 8px 20px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: monospace;
    letter-spacing: 1px;
  }
  .conn-row button:hover, .ctrl-btn:hover { color: var(--text); border-color: var(--dim); }
  .conn-row button.connected { color: var(--accent); border-color: var(--accent); }
  #cube-status { font-size: 22px; color: var(--dim); }
  #cube-status.ok { color: var(--accent); }
  #cube-status.err { color: var(--warm); }

  .ws-status-inline {
    font-size: 22px;
    color: var(--dim);
  }
  .ws-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff3333;
    margin-right: 5px;
    vertical-align: middle;
  }
  .ws-dot.connected { background: var(--accent); }
  .header-status {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--dim);
  }
  .header-status .val { color: var(--text); }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .cube-rotate-ctrl {
    display: flex;
    gap: 4px;
    align-items: center;
    background: transparent;
    padding: 0;
    border: none;
    user-select: none;
  }
  .cube-rotate-ctrl .cr-label {
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: 2px;
  }
  .cube-rotate-ctrl button {
    padding: 3px 8px;
    font-size: 10px;
    font-family: monospace;
    font-weight: 600;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
  }
  .cube-rotate-ctrl button:hover { color: var(--text); }
  .cube-rotate-ctrl button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* State rows (left overlay, transparent) */
  .state-rows { display: flex; flex-direction: column; gap: 3px; }
  .state-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 24px;
    background: transparent;
    gap: 10px;
  }
  .state-label { color: var(--dim); text-transform: lowercase; letter-spacing: 0.5px; }
  .state-val { font-weight: 600; color: var(--text); font-size: 22px; }
  .state-val.accent { color: var(--accent); }
  .state-val.accent2 { color: var(--accent2); }
  .state-val.warm { color: var(--warm); }
  .state-val.gold { color: var(--gold); }
  .state-val.clickable { cursor: pointer; user-select: none; transition: color .12s, text-shadow .12s; }
  .state-val.clickable:hover { color: var(--accent); text-shadow: 0 0 6px var(--accent); }

  .sub-heading {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    margin: 14px 0 8px;
    text-transform: uppercase;
  }

  /* Sequence Control panel */
  .sequence-panel { grid-column: 1 / -1; }
  .seq-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .seq-controls label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .seq-controls select, .seq-controls input[type="text"] {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
  }
  .seq-controls select { min-width: 180px; }
  .ctrl-btn.active {
    background: var(--warm);
    color: white;
  }
  .seq-status {
    font-size: 12px;
    color: var(--dim);
    margin-left: auto;
  }
  .seq-status .val { color: var(--accent); font-weight: 600; }

  /* Active vertex indicator in sequence bar */
  .seq-vertex-bar {
    display: flex;
    gap: 4px;
    margin-top: 12px;
  }
  .seq-vertex-pip {
    flex: 1;
    height: 32px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
    transition: all 0.2s;
    position: relative;
  }
  .seq-vertex-pip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--active-glow);
    box-shadow: 0 0 12px var(--active-glow);
  }
  .seq-vertex-pip .pip-complex {
    position: absolute;
    bottom: -14px;
    font-size: 8px;
    color: var(--dim);
    white-space: nowrap;
  }
  .seq-vertex-pip.active .pip-complex { color: var(--text); }

  /* Active vertex + complex cards (bottom-left overlay) */
  .vertex-grid, .complex-grid { display: block; }
  .vertex-card, .complex-card {
    display: none;
    background: rgba(10, 10, 15, 0.55);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 10px;
    text-align: center;
    transition: all 0.25s;
  }
  .vertex-card.active, .complex-card.active {
    display: block;
    border-color: var(--accent);
    background: rgba(0, 255, 136, 0.10);
    box-shadow: 0 0 12px var(--active-glow);
    padding: 8px 12px;
    width: 160px;
    align-self: flex-start;
  }
  .vertex-card.active .intensity-bar { display: none; }
  .vertex-label {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .vertex-param {
    font-size: 27px;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
  }
  .vertex-param .val { color: var(--accent); font-weight: 600; }
  .vertex-param .val { color: var(--text); }
  .vertex-card.active .vertex-param .val { color: #fff; }
  .intensity-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .intensity-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .complex-num {
    font-size: 39px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .complex-name {
    font-size: 22px;
    color: var(--dim);
    line-height: 1.3;
  }

  /* Complex type colors */
  .ct-1 { border-color: #ff4444; color: #ff4444; }
  .ct-2 { border-color: #ffaa22; color: #ffaa22; }
  .ct-3 { border-color: #44cc44; color: #44cc44; }
  .ct-4 { border-color: #44dddd; color: #44dddd; }
  .ct-5 { border-color: #4488ff; color: #4488ff; }
  .ct-6 { border-color: #aa44ff; color: #aa44ff; }
  .ct-7 { border-color: #ff44cc; color: #ff44cc; }
  .ct-8 { border-color: #cccccc; color: #cccccc; }

  /* Sieve — piano roll */
  .sieve-strip {
    display: flex;
    gap: 0;
    height: 52px;
    align-items: stretch;
    pointer-events: auto;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(0, 204, 255, 0.25);
  }
  .sieve-cell {
    flex: 1;
    min-width: 0;
    position: relative;
    height: 100%;
    border-right: 1px solid rgba(0, 0, 0, 0.4);
    transition: background 0.2s, box-shadow 0.2s;
  }
  /* White keys — default */
  .sieve-cell {
    background: rgba(200, 220, 235, 0.10);
  }
  /* Black keys — darker, slightly shorter (top band) */
  .sieve-cell.black {
    background: rgba(0, 0, 0, 0.55);
  }
  .sieve-cell.black::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 62%;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 0 0 2px 2px;
    pointer-events: none;
  }
  /* Octave C gets a left divider line */
  .sieve-cell.octave-start {
    border-left: 1px solid rgba(0, 204, 255, 0.35);
  }
  .sieve-cell.active {
    background: var(--accent2);
    box-shadow: 0 0 12px var(--accent2), inset 0 0 8px rgba(255,255,255,0.3);
  }
  .sieve-cell.active::after {
    background: var(--accent2);
  }
  .sieve-cell.active .sieve-bar {
    background: var(--accent2);
  }
  .sieve-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0;
    background: transparent;
    transition: height 0.3s;
  }
  .sieve-labels {
    display: flex;
    gap: 0;
    margin-top: 3px;
    height: 14px;
  }
  .sieve-labels span {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
    line-height: 14px;
    letter-spacing: 0.5px;
  }
  .sieve-labels span.octave-label {
    color: var(--accent2);
  }
  .sieve-labels span.active { color: var(--accent); }

  /* Hidden (JS still writes to these) */
  .log-panel, .gyro-panel, .sequence-panel, .vertices-panel, .complexes-panel, .spell-panel { display: none !important; }
  /* Keep active vertex/complex cards visible even though grid containers hide by default */
  .ovl-tl .vertex-grid, .ovl-tl .complex-grid { display: block !important; }
  .active-cards { display: flex; flex-direction: column; gap: 6px; }

  .move-log {
    font-size: 12px;
    max-height: 150px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .move-entry {
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    animation: flash-in 0.3s ease-out;
  }
  .move-entry .move-name { color: var(--gold); font-weight: 600; min-width: 30px; }
  .move-entry .move-detail { color: var(--dim); }
  .move-entry .move-vertex { color: var(--accent); font-weight: 600; }

  @keyframes flash-in {
    0% { background: rgba(0, 255, 136, 0.15); }
    100% { background: transparent; }
  }


  /* Permutation display */
  .perm-display {
    display: flex;
    gap: 4px;
    margin-top: 2px;
    flex-wrap: nowrap;
    width: 100%;
  }
  .perm-slot {
    flex: 1;
    min-width: 0;
    height: 44px;
    background: rgba(10, 10, 15, 0.5);
    border: 1px solid var(--border);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 600;
    color: var(--accent);
    transition: all 0.3s;
  }
  /* Make the permutation row stack label above slots so 8 boxes fit */
  .state-row.perm-row {
    flex-direction: column;
    align-items: stretch;
  }
  .state-row.perm-row .state-label { margin-bottom: 2px; }
  .perm-slot.active {
    border-color: var(--accent);
    background: var(--active-glow);
    color: #fff;
  }

  /* === V2 Panels === */

  /* Spell buffer (top-center, transparent) */
  .spell-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .spell-notification {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    min-height: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }
  .spell-notification.active {
    animation: spell-flash 1.5s ease-out forwards;
  }
  @keyframes spell-flash {
    0% { color: #fff; text-shadow: 0 0 12px var(--gold), 0 0 24px var(--gold); }
    100% { color: var(--gold); text-shadow: none; }
  }
  .spell-buffer {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .spell-buffer-move {
    padding: 0;
    font-size: 18px;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text);
    transition: color 0.15s;
    letter-spacing: 2px;
  }
  .spell-buffer-move.matched {
    color: var(--gold);
  }
  .spell-partials {
    font-size: 10px;
    color: var(--dim);
    min-width: 120px;
    text-align: right;
  }
  .spell-partials .partial-name {
    color: var(--text);
    font-weight: 600;
  }
  .spell-partials .partial-bar {
    display: inline-block;
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    margin-left: 4px;
    vertical-align: middle;
    transition: width 0.15s;
  }

  /* Mode badges (left overlay) */
  .mode-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .mode-badge {
    padding: 7px 16px;
    font-size: 22px;
    font-weight: 700;
    border-radius: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: transparent;
  }
  .mode-badge.voice-seq {
    background: rgba(0, 255, 136, 0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .mode-badge.voice-poly {
    background: rgba(0, 204, 255, 0.12);
    border: 1px solid var(--accent2);
    color: var(--accent2);
  }
  .mode-badge.frozen {
    background: rgba(255, 102, 68, 0.12);
    border: 1px solid var(--warm);
    color: var(--warm);
  }
  .mode-badge.palette {
    background: rgba(255, 204, 0, 0.08);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .mode-badge.regime-contemplative {
    background: rgba(0, 255, 136, 0.10);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .mode-badge.regime-conversational {
    background: rgba(255, 204, 0, 0.10);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .mode-badge.regime-burst {
    background: rgba(255, 102, 68, 0.15);
    border: 1px solid var(--warm);
    color: var(--warm);
  }
  .mode-badge.solved {
    background: rgba(255, 204, 0, 0.12);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .mode-badge.solved.dim {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .mode-badge.solved.pulse {
    animation: solved-pulse 2.4s ease-out;
  }
  @keyframes solved-pulse {
    0%   { color: #fff; background: rgba(255, 204, 0, 0.35); border-color: #fff;       box-shadow: 0 0 16px var(--gold), 0 0 32px var(--gold); }
    40%  { color: var(--gold); background: rgba(255, 204, 0, 0.20); border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
    100% { color: var(--gold); background: rgba(255, 204, 0, 0.12); border-color: var(--gold); box-shadow: none; }
  }
  .turn-rate-val {
    font-size: 22px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    min-width: 100px;
    text-align: right;
  }
  .scramble-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .scramble-label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .scramble-bar-outer {
    width: 150px;
    height: 10px;
    background: rgba(10,10,15,0.5);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .scramble-bar-inner {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s, background 0.3s;
  }
  .scramble-val {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    min-width: 56px;
  }

  /* Expression overlay (now in left column) */
  .expression-panel {
    background: transparent;
    padding: 0;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .expr-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .expr-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    padding: 2px 0;
  }
  .expr-label {
    font-size: 22px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    flex: 0 0 180px;
  }
  .expr-value {
    font-size: 27px;
    font-weight: 600;
    color: var(--accent);
    font-family: monospace;
    min-width: 90px;
  }
  .expr-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .expr-bar {
    height: 100%;
    width: 0%;
    background: var(--accent2);
    border-radius: 2px;
    transition: width 0.1s;
  }
  .expr-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
    max-width: 480px;
  }
  .expr-controls button {
    padding: 9px 20px;
    font-size: 22px;
    font-family: monospace;
    font-weight: 600;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 1px;
    align-self: flex-start;
  }
  .expr-controls .smooth-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    color: var(--dim);
  }
  .expr-controls .smooth-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent2);
  }

  /* Spell history toast */

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { connectGanCube } from 'https://cdn.jsdelivr.net/npm/gan-web-bluetooth@latest/+esm';

// ============================================================
// Constants
// ============================================================

const COMPLEX_SHORT = {
  1: 'pizz scatter',
  2: 'bowed sweep',
  3: 'bowed sustain',
  4: 'harm+legno',
  5: 'wild gliss',
  6: 'ord. gliss',
  7: 'tasto sust.',
  8: 'ponticello',
};

const COMPLEX_ABBR = {
  1: 'pizz', 2: 'bow', 3: 'sust', 4: 'harm',
  5: 'glsW', 6: 'glsM', 7: 'glsS', 8: 'pont'
};

// Ghost-cube dot palette. Cool-spectrum hue sweep from cyan → violet → pink
// so each C-identity has a distinct dot color while staying in the ghost's
// "cool landmark" aesthetic. Ghost wireframe stays 0x00ccff (edges are
// structure, dots are identity). Paired dim colours for the abbreviation
// line on labels are ~60% luminance of the main hue.
const GHOST_VERT_COLORS = [
  0x00ccff, // C1 cyan (reference)
  0x00ffdd, // C2 teal
  0x55bbff, // C3 sky blue
  0x8899ff, // C4 periwinkle
  0xbb88ff, // C5 lavender
  0xdd77ff, // C6 violet
  0xff66ee, // C7 orchid
  0xff5599, // C8 hot pink
];
const GHOST_VERT_COLORS_HEX = [
  '#00ccff', '#00ffdd', '#55bbff', '#8899ff',
  '#bb88ff', '#dd77ff', '#ff66ee', '#ff5599',
];
const GHOST_VERT_COLORS_DIM = [
  '#0099cc', '#00ccaa', '#4488cc', '#6677cc',
  '#8866cc', '#aa55cc', '#cc5599', '#cc4477',
];

const INTENSITY_LEVELS = { 'p': 0.1, 'mp': 0.25, 'mf': 0.42, 'f': 0.58, 'ff': 0.75, 'fff': 0.92 };

// Phase A1 — mirror of FACE_SIGNATURES (envelope/articulation/motion +
// registerBias for notation). Source of truth lives in src/face-gesture.ts;
// this is for HUD + tier-1 notation. Half-turns (L2/R2/...) and non-face
// moves return null.
const FACE_SIG = {
  'U':  { envelope: 'pluck', articulation: 'attack',    motion: 'up',        registerBias:  0.8 },
  "U'": { envelope: 'fade',  articulation: 'release',   motion: 'down',      registerBias:  0.8 },
  'D':  { envelope: 'stab',  articulation: 'attack',    motion: 'down',      registerBias: -0.8 },
  "D'": { envelope: 'drone', articulation: 'sustained', motion: 'static',    registerBias: -0.8 },
  'L':  { envelope: 'swell', articulation: 'sustained', motion: 'up',        registerBias:  0.0 },
  "L'": { envelope: 'fade',  articulation: 'release',   motion: 'down',      registerBias:  0.0 },
  'R':  { envelope: 'stab',  articulation: 'attack',    motion: 'static',    registerBias:  0.0 },
  "R'": { envelope: 'burst', articulation: 'iterative', motion: 'oscillate', registerBias:  0.0 },
  'F':  { envelope: 'swell', articulation: 'sustained', motion: 'up',        registerBias:  0.3 },
  "F'": { envelope: 'swell', articulation: 'sustained', motion: 'down',      registerBias:  0.3 },
  'B':  { envelope: 'pluck', articulation: 'attack',    motion: 'static',    registerBias: -0.3 },
  "B'": { envelope: 'drone', articulation: 'sustained', motion: 'oscillate', registerBias: -0.3 },
};

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function semitoneName(s) {
  const midi = 36 + s;
  const octave = Math.floor(midi / 12) - 1;
  return NOTE_NAMES[midi % 12] + octave;
}

// Cube vertex positions (matching group.ts labeling)
const CUBE_VERTS = [
  new THREE.Vector3( 1,  1,  1),  // 0 FTR
  new THREE.Vector3(-1,  1,  1),  // 1 FTL
  new THREE.Vector3(-1,  1, -1),  // 2 BTL
  new THREE.Vector3( 1,  1, -1),  // 3 BTR
  new THREE.Vector3( 1, -1,  1),  // 4 FBR
  new THREE.Vector3(-1, -1,  1),  // 5 FBL
  new THREE.Vector3(-1, -1, -1),  // 6 BBL
  new THREE.Vector3( 1, -1, -1),  // 7 BBR
];

const CUBE_EDGES = [
  [0,1],[1,2],[2,3],[3,0],
  [4,5],[5,6],[6,7],[7,4],
  [0,4],[1,5],[2,6],[3,7],
];

const TETRA_A = [0, 2, 5, 7];
const TETRA_B = [1, 3, 4, 6];

// ============================================================
// Three.js Cube Scene
// ============================================================

const canvas = document.getElementById('cube-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 100);
camera.position.set(4, 3, 4);
camera.lookAt(0, 0, 0);

// On cube connect, orbit the camera by this azimuth (around world Y) so the
// on-screen cube matches the performer's physical perspective. Empirically
// -135° = the user's "drag left 135°" gesture. Flip sign if the world Y
// convention in your Three.js build rotates the other way.
const CUBE_VIEW_AZIMUTH_RAD = -135 * Math.PI / 180;
const _pristineCameraPos = camera.position.clone();
let _cubeViewApplied = false;
function applyCubeConnectView() {
  if (_cubeViewApplied) return;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), CUBE_VIEW_AZIMUTH_RAD);
  const offset = camera.position.clone().sub(controls.target);
  offset.applyQuaternion(q);
  camera.position.copy(controls.target).add(offset);
  camera.lookAt(controls.target);
  controls.update();
  _cubeViewApplied = true;
  // Adopt the first BLE quaternion as the zero reference, so the
  // camera angle is a pure viewing preference — independent of how
  // the cube happens to be held at the moment of connect.
  autoZeroPending = true;
}
function revertCubeConnectView() {
  if (!_cubeViewApplied) return;
  camera.position.copy(_pristineCameraPos);
  camera.lookAt(controls.target);
  controls.update();
  _cubeViewApplied = false;
}

// Wireframe cube
const edgeGeo = new THREE.BufferGeometry();
const edgePositions = [];
for (const [a, b] of CUBE_EDGES) {
  edgePositions.push(CUBE_VERTS[a].x, CUBE_VERTS[a].y, CUBE_VERTS[a].z);
  edgePositions.push(CUBE_VERTS[b].x, CUBE_VERTS[b].y, CUBE_VERTS[b].z);
}
edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
const edgeMat = new THREE.LineBasicMaterial({ color: 0x333355 });
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

// Tetrahedra wireframes
function makeTetraLines(indices, color) {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < indices.length; i++) {
    for (let j = i + 1; j < indices.length; j++) {
      const a = CUBE_VERTS[indices[i]], b = CUBE_VERTS[indices[j]];
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 }));
}
const tetraALines = makeTetraLines(TETRA_A, 0x00ff88);
const tetraBLines = makeTetraLines(TETRA_B, 0xff6644);
scene.add(tetraALines);
scene.add(tetraBLines);

// Vertex spheres + labels
const vertexMeshes = [];
const vertexLabels = [];

// Active vertex glow ring
const activeRingGeo = new THREE.RingGeometry(0.15, 0.22, 16);
const activeRingMat = new THREE.MeshBasicMaterial({
  color: 0x00ff88,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide,
});
const activeRing = new THREE.Mesh(activeRingGeo, activeRingMat);
activeRing.visible = false;

function makeLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 80;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(text, 64, 2);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.0, 0.625, 1);
  return { sprite, canvas: c, ctx, tex };
}

for (let i = 0; i < 8; i++) {
  const isTetraA = TETRA_A.includes(i);
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: isTetraA ? 0x00ff88 : 0xff6644 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(CUBE_VERTS[i]);
  scene.add(mesh);
  vertexMeshes.push(mesh);

  const label = makeLabel(`K${i + 1}`, isTetraA ? '#00ff88' : '#ff6644');
  label.sprite.position.copy(CUBE_VERTS[i]).addScaledVector(CUBE_VERTS[i].clone().normalize(), 0.55);
  scene.add(label.sprite);
  vertexLabels.push(label);
}

// Rotation group for gyro
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);
cubeGroup.add(edgeLines, tetraALines, tetraBLines, activeRing);
vertexMeshes.forEach(m => cubeGroup.add(m));
vertexLabels.forEach(l => cubeGroup.add(l.sprite));

// Ghost cube — shows the S4 element the gyro is currently snapping to.
// Faint cyan wireframe + 8 small markers, oriented at state.snapQuat.
// When the live cube and ghost overlap → gyro is locked on a snap target.
// When they diverge → drifting toward the next snap (deviation factor).
const ghostGroup = new THREE.Group();
ghostGroup.visible = false;
scene.add(ghostGroup);

const ghostEdgeMat = new THREE.LineBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.35 });
const ghostEdges = new THREE.LineSegments(edgeGeo.clone(), ghostEdgeMat);
ghostGroup.add(ghostEdges);

// Ghost dots + labels are identity-bound: mesh/label k represents C_{k+1}.
// Per-C color from GHOST_VERT_COLORS; each mesh gets its own cloned material
// so updateSnapOverlay can modulate opacity per mesh without cross-talk.
// Text on the label (`C{n}` + abbreviation) never changes — only the label's
// position animates as the complex's slot shifts on each turn.
const ghostVertGeo = new THREE.SphereGeometry(0.05, 6, 6);
const ghostVertMeshes = [];
const ghostLabels = [];
for (let i = 0; i < 8; i++) {
  const mat = new THREE.MeshBasicMaterial({
    color: GHOST_VERT_COLORS[i], transparent: true, opacity: 0.55,
  });
  const m = new THREE.Mesh(ghostVertGeo.clone(), mat);
  m.position.copy(CUBE_VERTS[i]);
  ghostGroup.add(m);
  ghostVertMeshes.push(m);

  // Two-line identity label: C# on top, playing-mode abbreviation below.
  // Bypasses makeLabel's single-line default by overwriting the canvas.
  const label = makeLabel(`C${i + 1}`, GHOST_VERT_COLORS_HEX[i]);
  const ctx = label.ctx;
  ctx.clearRect(0, 0, 128, 80);
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = GHOST_VERT_COLORS_HEX[i];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`C${i + 1}`, 64, 2);
  ctx.font = '12px monospace';
  ctx.fillStyle = GHOST_VERT_COLORS_DIM[i];
  ctx.fillText(COMPLEX_ABBR[i + 1] || '', 64, 22);
  label.tex.needsUpdate = true;
  label.sprite.position.copy(CUBE_VERTS[i]).addScaledVector(CUBE_VERTS[i].clone().normalize(), 0.45);
  label.sprite.scale.set(0.7, 0.44, 1);
  ghostGroup.add(label.sprite);
  ghostLabels.push(label);
}

// K↔C connection line. Active K-dot (live cube, scaled-up sphere) connected
// to its geometrically nearest C-dot (ghost cube) with a thin white line —
// one visible "performance pair" across the two cubes. Added directly to
// scene (not cubeGroup / ghostGroup) so the vertices live in world space;
// animate loop computes both endpoints via getWorldPosition. depthTest off
// + renderOrder 1 so the line draws over both cubes instead of being
// clipped by intervening geometry. At deviation≈0 the nearest-C is the
// same-slot C and the line collapses to zero length (invisible naturally).
const kcLineGeo = new THREE.BufferGeometry();
const kcLinePositions = new Float32Array(6);
kcLineGeo.setAttribute('position', new THREE.BufferAttribute(kcLinePositions, 3));
const kcLineMat = new THREE.LineBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.7,
  depthTest: false,
});
const kcLine = new THREE.Line(kcLineGeo, kcLineMat);
kcLine.renderOrder = 1;
kcLine.visible = false;
kcLine.frustumCulled = false;
scene.add(kcLine);
const _kcKWorld = new THREE.Vector3();
const _kcCWorld = new THREE.Vector3();
const _kcTmpWorld = new THREE.Vector3();

// OrbitControls for camera mode
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 24;

// Per-cube view offsets (premultiplied onto the live/ghost rotation).
const liveViewOffset = new THREE.Quaternion(0, 0, 0, 1);
const ghostViewOffset = new THREE.Quaternion(0, 0, 0, 1);
let rotateTarget = 'camera'; // 'camera' | 'live' | 'ghost'

// ---- Rotation Gizmo (separate mini-canvas, bottom-right corner) ----
const gizmoCanvas = document.createElement('canvas');
gizmoCanvas.width = 200; gizmoCanvas.height = 200;
gizmoCanvas.style.cssText = 'position:fixed;top:56px;right:20px;width:200px;height:200px;z-index:3;touch-action:none;border-radius:50%;cursor:grab;';
document.body.appendChild(gizmoCanvas);

const gizmoRenderer = new THREE.WebGLRenderer({ canvas: gizmoCanvas, antialias: true, alpha: true });
gizmoRenderer.setPixelRatio(window.devicePixelRatio);
const gizmoScene = new THREE.Scene();
const gizmoCamera = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.1, 100);
gizmoCamera.position.set(3, 2.5, 3);
gizmoCamera.lookAt(0, 0, 0);

const GIZMO_COLORS = { x: 0xff4444, y: 0x44ff44, z: 0x4488ff };
const GIZMO_HIGHLIGHT = { x: 0xff8888, y: 0x88ff88, z: 0x88bbff };
const gizmoAxes = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1),
};
const gizmoRotations = {
  x: new THREE.Euler(0, Math.PI / 2, 0),
  y: new THREE.Euler(Math.PI / 2, 0, 0),
  z: new THREE.Euler(0, 0, 0),
};

const gizmoRings = {};
const gizmoHitRings = {};

for (const axis of ['x', 'y', 'z']) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.04, 12, 64),
    new THREE.MeshBasicMaterial({ color: GIZMO_COLORS[axis], transparent: true, opacity: 0.85, depthTest: false })
  );
  ring.rotation.copy(gizmoRotations[axis]);
  ring.renderOrder = 999;
  ring.userData.axis = axis;
  gizmoScene.add(ring);
  gizmoRings[axis] = ring;

  const hitRing = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.18, 8, 48),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitRing.rotation.copy(gizmoRotations[axis]);
  hitRing.userData.axis = axis;
  gizmoScene.add(hitRing);
  gizmoHitRings[axis] = hitRing;
}

// Axis nubs (small spheres at axis tips with labels)
for (const [axis, color] of Object.entries(GIZMO_COLORS)) {
  const pos = gizmoAxes[axis].clone().multiplyScalar(1.45);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 8, 8),
    new THREE.MeshBasicMaterial({ color, depthTest: false })
  );
  dot.position.copy(pos);
  dot.renderOrder = 1000;
  gizmoScene.add(dot);

  // Axis letter sprite
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(axis.toUpperCase(), 16, 16);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sprite.position.copy(pos).addScaledVector(gizmoAxes[axis], 0.25);
  sprite.scale.set(0.35, 0.35, 1);
  sprite.renderOrder = 1001;
  gizmoScene.add(sprite);
}

const gizmoRaycaster = new THREE.Raycaster();
const gizmoPointer = new THREE.Vector2();
let gizmoDragging = false;
let gizmoActiveAxis = null;
let gizmoDragAngleStart = 0;

function getGizmoAngle(clientX, clientY) {
  const rect = gizmoCanvas.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  return Math.atan2(clientY - cy, clientX - cx);
}

function hitTestGizmo(clientX, clientY) {
  const rect = gizmoCanvas.getBoundingClientRect();
  gizmoPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  gizmoPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  gizmoRaycaster.setFromCamera(gizmoPointer, gizmoCamera);
  const hits = gizmoRaycaster.intersectObjects(Object.values(gizmoHitRings));
  return hits.length > 0 ? hits[0].object.userData.axis : null;
}

gizmoCanvas.addEventListener('pointerdown', (e) => {
  if (rotateTarget === 'camera') return;
  const axis = hitTestGizmo(e.clientX, e.clientY);
  if (!axis) return;
  e.stopPropagation();
  gizmoDragging = true;
  gizmoActiveAxis = axis;
  gizmoDragAngleStart = getGizmoAngle(e.clientX, e.clientY);
  gizmoCanvas.setPointerCapture(e.pointerId);
  for (const a of ['x', 'y', 'z']) {
    gizmoRings[a].material.color.setHex(a === axis ? GIZMO_HIGHLIGHT[a] : GIZMO_COLORS[a]);
    gizmoRings[a].material.opacity = a === axis ? 1.0 : 0.2;
  }
});

window.addEventListener('pointermove', (e) => {
  if (!gizmoDragging) {
    if (rotateTarget !== 'camera') {
      const rect = gizmoCanvas.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (inside) {
        const axis = hitTestGizmo(e.clientX, e.clientY);
        gizmoCanvas.style.cursor = axis ? 'grab' : 'default';
        for (const a of ['x', 'y', 'z']) {
          gizmoRings[a].material.opacity = (a === axis) ? 1.0 : 0.85;
        }
      }
    }
    return;
  }
  const angle = getGizmoAngle(e.clientX, e.clientY);
  let delta = angle - gizmoDragAngleStart;
  // Wrap delta to avoid jumps crossing ±PI
  if (delta > Math.PI) delta -= 2 * Math.PI;
  if (delta < -Math.PI) delta += 2 * Math.PI;

  // Flip if gizmo camera looks at the negative side of the axis
  const camDir = gizmoCamera.position.clone().normalize();
  if (camDir.dot(gizmoAxes[gizmoActiveAxis]) < 0) delta = -delta;

  gizmoDragAngleStart = angle;
  const offset = (rotateTarget === 'live') ? liveViewOffset : ghostViewOffset;
  offset.premultiply(new THREE.Quaternion().setFromAxisAngle(gizmoAxes[gizmoActiveAxis], -delta));
});

const endGizmoDrag = (e) => {
  if (!gizmoDragging) return;
  gizmoDragging = false;
  gizmoActiveAxis = null;
  gizmoCanvas.style.cursor = 'grab';
  if (gizmoCanvas.hasPointerCapture(e.pointerId)) gizmoCanvas.releasePointerCapture(e.pointerId);
  for (const a of ['x', 'y', 'z']) {
    gizmoRings[a].material.color.setHex(GIZMO_COLORS[a]);
    gizmoRings[a].material.opacity = 0.85;
  }
};
window.addEventListener('pointerup', endGizmoDrag);
window.addEventListener('pointercancel', endGizmoDrag);

rotateCtrl.querySelectorAll('.cr-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    rotateTarget = btn.dataset.target;
    rotateCtrl.querySelectorAll('.cr-btn').forEach(b => b.classList.toggle('active', b === btn));
    controls.enabled = (rotateTarget === 'camera');
    gizmoCanvas.style.opacity = (rotateTarget === 'camera') ? '0.3' : '1';
    gizmoCanvas.style.pointerEvents = (rotateTarget === 'camera') ? 'none' : 'auto';
  });
});
rotateCtrl.querySelector('.cr-reset').addEventListener('click', () => {
  if (rotateTarget === 'live') liveViewOffset.identity();
  else if (rotateTarget === 'ghost') ghostViewOffset.identity();
  else controls.reset();
});
// Initial state: camera mode, gizmo dimmed
gizmoCanvas.style.opacity = '0.3';
gizmoCanvas.style.pointerEvents = 'none';

let idleAngle = 0;
let currentGyro = new THREE.Quaternion(0, 0, 0, 1);
let currentSnap = new THREE.Quaternion(0, 0, 0, 1);
let hasGyro = false;
let hasSnap = false;
let currentActiveVertex = 0;

// Ghost snap animation. When the S4 snap element changes, we SLERP the
// displayed ghost from its current pose to the new target over
// GHOST_SNAP_MS. Interrupt-safe: if a new snap lands mid-flight, we
// recapture the currently-displayed `ghostAnimated` as the new `ghostFrom`
// so the ghost keeps flowing toward the latest target without jumping.
// `ghostTarget` is always the latest authoritative snap, so rapid turns
// can never lose track — worst case the ghost chases behind and catches
// up once turns stop.
const ghostFrom = new THREE.Quaternion(0, 0, 0, 1);
const ghostTarget = new THREE.Quaternion(0, 0, 0, 1);
const ghostAnimated = new THREE.Quaternion(0, 0, 0, 1);
let ghostAnimStart = 0;
let ghostAnimReady = false;
let lastSnapElement = -1;
const GHOST_SNAP_MS = 100;

// Active-vertex step animation. Same interrupt-safe pattern as the ghost
// snap: on active-vertex change, capture the currently displayed sphere
// scales and ring position as the animation start, then LERP them toward
// the new target over ACTIVE_STEP_MS. Rapid stepping just keeps rewriting
// the start pose from whatever the animate loop last painted.
const ACTIVE_STEP_MS = 100;
const sphereScaleFrom = new Float32Array(8).fill(1.0);
const activeRingFrom = new THREE.Vector3();
const activeRingAnimated = new THREE.Vector3();
let activeAnimStart = 0;
let activeAnimReady = false;
let currentActiveK = 0;

// Vertex-position animation. `vertexMeshes[k]` and `vertexLabels[k]` are
// identity-bound (mesh k represents K_{k+1}); each S4 permutation moves the
// identity to a new slot, and we LERP the dot + label from old slot to new
// slot over VERTEX_STEP_MS instead of teleporting the label text in place.
// LABEL_OFFSET_FACTOR places the sprite 0.55 along the outward normal of a
// unit cube corner — scalar because |CUBE_VERTS| = sqrt(3) is constant, so
// label.position = sphere.position * factor throughout the animation.
// Interrupt-safe: a new perm mid-flight captures the currently painted
// positions as the new `from`.
const VERTEX_STEP_MS = 100;
const LABEL_OFFSET_FACTOR = 1 + 0.55 / Math.sqrt(3);
const vertexPosFrom     = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
const vertexPosTarget   = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
const vertexPosAnimated = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
let vertexAnimStart = 0;
let vertexAnimReady = false;
let lastPermKey = '';

// Ghost-vertex position animation. Mirrors the K-vertex pattern but for the
// C-cube: `ghostVertMeshes[k]` / `ghostLabels[k]` represent C_{k+1}, and
// each turn moves that C-type to a new slot per `state.cAssignments`. On a
// pure S4 turn the dots slide coherently; on an α↔β↔γ phase boundary the
// baseMapping changes so multiple dots may reshuffle simultaneously — the
// LERP makes that reshuffle legible instead of instant. Offset factor uses
// the ghost label's 0.45 distance (vs K's 0.55).
const GHOST_VERT_STEP_MS = 100;
const GHOST_LABEL_OFFSET_FACTOR = 1 + 0.45 / Math.sqrt(3);
const ghostVertPosFrom     = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
const ghostVertPosTarget   = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
const ghostVertPosAnimated = Array.from({ length: 8 }, (_, i) => CUBE_VERTS[i].clone());
let ghostVertAnimStart = 0;
let ghostVertAnimReady = false;
let lastCAssignKey = '';

// Gyro zero calibration
let gyroZeroInv = new THREE.Quaternion(0, 0, 0, 1);

// Decouples on-screen orientation from however the cube is physically
// held at connect time. Set by applyCubeConnectView; consumed by the
// gyro_tick handler on the first sample, which adopts it as the zero.
let autoZeroPending = false;

document.getElementById('zeroBtn').addEventListener('click', () => {
  gyroZeroInv.copy(currentGyro).invert();
  // Mirror the zero over to the relay so the engine's snap cells re-center
  // on the user's rest pose — without this, snap thresholds stay anchored
  // to the raw sensor frame and feel asymmetric (see relay.js's
  // `engineGyroZeroInv` comment).
  wsSend({ type: 'zero_gyro' });
});

function resizeCube() {
  const rect = canvas.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
resizeCube();
window.addEventListener('resize', resizeCube);

const calibratedGyro = new THREE.Quaternion();

// Pulse animation for active ring
let ringPulse = 0;

function animateCube() {
  requestAnimationFrame(animateCube);
  controls.update();
  if (hasGyro) {
    calibratedGyro.copy(gyroZeroInv).multiply(currentGyro);
  } else {
    idleAngle += 0.003;
    calibratedGyro.setFromEuler(new THREE.Euler(0.3, idleAngle, 0.15));
  }
  cubeGroup.quaternion.copy(liveViewOffset).multiply(calibratedGyro);

  // Ghost cube — stays in world frame (no gyroZeroInv) so Zero Gyro only
  // recenters the live cube. The ghost remains a fixed S4-snap reference.
  // SLERP from ghostFrom to ghostTarget over GHOST_SNAP_MS so the ghost
  // glides between S4 elements instead of teleporting.
  if (hasSnap) {
    ghostGroup.visible = true;
    const elapsed = performance.now() - ghostAnimStart;
    const t = elapsed >= GHOST_SNAP_MS ? 1 : elapsed / GHOST_SNAP_MS;
    ghostAnimated.copy(ghostFrom).slerp(ghostTarget, t);
    ghostGroup.quaternion.copy(ghostViewOffset).multiply(ghostAnimated);
  } else {
    ghostGroup.visible = false;
  }

  // Active-vertex step animation — scales the active sphere up (2.5×) and
  // all others down (1×), plus slides the glow ring to the active slot,
  // over ACTIVE_STEP_MS. Sphere scaling is identity-bound (currentActiveK =
  // perm[slot]); the ring stays slot-bound. See updateActiveVertexIn3D.
  if (activeAnimReady) {
    const elapsed = performance.now() - activeAnimStart;
    const t = elapsed >= ACTIVE_STEP_MS ? 1 : elapsed / ACTIVE_STEP_MS;
    for (let k = 0; k < 8; k++) {
      const target = (k === currentActiveK) ? 2.5 : 1.0;
      const s = sphereScaleFrom[k] + (target - sphereScaleFrom[k]) * t;
      vertexMeshes[k].scale.setScalar(s);
    }
    activeRingAnimated.copy(activeRingFrom).lerp(CUBE_VERTS[currentActiveVertex], t);
    activeRing.position.copy(activeRingAnimated);
    activeRing.lookAt(camera.position);
  }

  // Vertex-position animation — each K-identity slides from its previous
  // slot to its new slot on each turn. See updateState for perm-change
  // capture. Label position follows the sphere via LABEL_OFFSET_FACTOR.
  if (vertexAnimReady) {
    const elapsed = performance.now() - vertexAnimStart;
    const t = elapsed >= VERTEX_STEP_MS ? 1 : elapsed / VERTEX_STEP_MS;
    for (let k = 0; k < 8; k++) {
      vertexPosAnimated[k].copy(vertexPosFrom[k]).lerp(vertexPosTarget[k], t);
      vertexMeshes[k].position.copy(vertexPosAnimated[k]);
      vertexLabels[k].sprite.position.copy(vertexPosAnimated[k]).multiplyScalar(LABEL_OFFSET_FACTOR);
    }
  }

  // Ghost-vertex position animation — each C-identity slides to its new
  // slot per state.cAssignments. Runs in ghostGroup's local frame, so the
  // dots compose naturally with the ghost's SLERP'd orientation.
  if (ghostVertAnimReady) {
    const elapsed = performance.now() - ghostVertAnimStart;
    const t = elapsed >= GHOST_VERT_STEP_MS ? 1 : elapsed / GHOST_VERT_STEP_MS;
    for (let k = 0; k < 8; k++) {
      ghostVertPosAnimated[k].copy(ghostVertPosFrom[k]).lerp(ghostVertPosTarget[k], t);
      ghostVertMeshes[k].position.copy(ghostVertPosAnimated[k]);
      ghostLabels[k].sprite.position.copy(ghostVertPosAnimated[k]).multiplyScalar(GHOST_LABEL_OFFSET_FACTOR);
    }
  }

  // Pulse active ring
  ringPulse += 0.04;
  if (activeRing.visible) {
    activeRingMat.opacity = 0.4 + 0.3 * Math.sin(ringPulse);
  }

  // K↔C connection line. Compute world positions of active K-dot and each
  // ghost C-dot, find the nearest, update the line's 2 vertices. Requires
  // explicit updateMatrixWorld since rAF renders after this block — without
  // it, getWorldPosition reads stale matrices from the previous frame.
  if (hasGyro && hasSnap) {
    cubeGroup.updateMatrixWorld(true);
    ghostGroup.updateMatrixWorld(true);
    vertexMeshes[currentActiveK].getWorldPosition(_kcKWorld);
    let bestDist2 = Infinity;
    for (let c = 0; c < 8; c++) {
      ghostVertMeshes[c].getWorldPosition(_kcTmpWorld);
      const d2 = _kcKWorld.distanceToSquared(_kcTmpWorld);
      if (d2 < bestDist2) {
        bestDist2 = d2;
        _kcCWorld.copy(_kcTmpWorld);
      }
    }
    kcLinePositions[0] = _kcKWorld.x;
    kcLinePositions[1] = _kcKWorld.y;
    kcLinePositions[2] = _kcKWorld.z;
    kcLinePositions[3] = _kcCWorld.x;
    kcLinePositions[4] = _kcCWorld.y;
    kcLinePositions[5] = _kcCWorld.z;
    kcLineGeo.attributes.position.needsUpdate = true;
    kcLine.visible = true;
  } else {
    kcLine.visible = false;
  }

  renderer.render(scene, camera);
  gizmoRenderer.render(gizmoScene, gizmoCamera);
}
animateCube();

function updateActiveVertexIn3D(slot, activeK) {
  if (!activeAnimReady) {
    // First call — skip the animation so the active highlight doesn't
    // sweep in from origin on connect.
    for (let k = 0; k < 8; k++) {
      const s = (k === activeK) ? 2.5 : 1.0;
      sphereScaleFrom[k] = s;
      vertexMeshes[k].scale.setScalar(s);
    }
    activeRingFrom.copy(CUBE_VERTS[slot]);
    activeRingAnimated.copy(CUBE_VERTS[slot]);
    activeAnimStart = performance.now() - ACTIVE_STEP_MS;
    activeAnimReady = true;
    activeRing.visible = true;
    currentActiveVertex = slot;
    currentActiveK = activeK;
  } else if (slot !== currentActiveVertex || activeK !== currentActiveK) {
    // Capture the actually-displayed scales and ring pos as the animation
    // start, so interrupted animations flow smoothly into the new step.
    for (let k = 0; k < 8; k++) {
      sphereScaleFrom[k] = vertexMeshes[k].scale.x;
    }
    activeRingFrom.copy(activeRingAnimated);
    activeAnimStart = performance.now();
    currentActiveVertex = slot;
    currentActiveK = activeK;
  }
  // Same slot+activeK → no-op; the animate loop keeps painting from the
  // current `sphereScaleFrom` / `activeRingFrom` toward the (unchanged) target.
}

function updateVertexLabels(perm, vertices, complexTypes, activeIdx) {
  // Labels are identity-bound: label k always reads "K{k+1}". Its D/G/U
  // values come from the slot currently occupied by identity k — state.
  // kVertices is slot-indexed (`kVertices[slot] = basevertices[perm[slot]]`),
  // so looking up by `perm.indexOf(k)` yields identity k's own values.
  const activeK = perm ? perm[activeIdx] : activeIdx;
  for (let k = 0; k < 8; k++) {
    const slot = perm ? perm.indexOf(k) : k;
    const isTetraA = TETRA_A.includes(k);
    const isActive = k === activeK;
    const color = isActive ? '#ffffff' : (isTetraA ? '#00ff88' : '#ff6644');
    const dimColor = isActive ? '#cccccc' : (isTetraA ? '#00cc66' : '#cc5533');
    const label = vertexLabels[k];
    const ctx = label.ctx;
    const W = 128, H = 80;
    ctx.clearRect(0, 0, W, H);

    // No background pill — active vertex is indicated by the glow ring
    // in the 3D scene and the active-card in the bottom-left overlay.

    // Line 1: K# only. Complex labels live on the GHOST cube — the live
    // cube is the K_i (parameter) domain, the ghost is the C_i (complex)
    // domain. Previously both cubes rendered complex abbreviations, which
    // (together with the engine's old lockstep advance) made it look like
    // `pizz/bow/harm` were glued to K#s. Keep K# exclusive to the live cube.
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`K${k + 1}`, W / 2, 2);

    // Line 2: intensity + density
    if (vertices) {
      const v = vertices[slot];
      ctx.font = '14px monospace';
      ctx.fillStyle = dimColor;
      ctx.fillText(`${v.intensity} d${v.density.toFixed(1)}`, W / 2, 24);

      // Line 3: duration
      ctx.fillText(`${v.duration}s`, W / 2, 42);
    }

    label.tex.needsUpdate = true;
  }
}

// Ghost labels are identity-bound and painted once at setup
// (see the per-C-type `makeLabel` loop); the label text never changes.
// Only the label position animates as the complex slides between slots,
// and opacity is modulated by updateSnapOverlay from gyro deviation.

function updateSnapOverlay(snapElement, deviation) {
  const snapVal = document.getElementById('s-snap');
  if (snapElement != null) {
    if (snapVal) snapVal.textContent = `S4 #${snapElement}`;
    // Ghost opacity: more opaque when locked, faint when drifting
    const ghostOpacity = 0.15 + 0.55 * (1 - deviation);
    ghostEdgeMat.opacity = ghostOpacity;
    ghostVertMeshes.forEach(m => { m.material.opacity = ghostOpacity + 0.1; });
    ghostLabels.forEach(l => { l.sprite.material.opacity = ghostOpacity + 0.2; });
  }
}
