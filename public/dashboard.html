<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XenaKube</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #1e1e2e;
    --text: #c8c8d8;
    --dim: #555568;
    --accent: #00ff88;
    --accent2: #00ccff;
    --warm: #ff6644;
    --gold: #ffcc00;
    --active-glow: rgba(0, 255, 136, 0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    position: relative;
  }

  /* Full-viewport cube canvas — background layer */
  #cube-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    z-index: 0;
  }

  /* Overlay panels — transparent backgrounds over cube */
  .ovl {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  .ovl > * { pointer-events: auto; }

  .ovl-tl { top: 16px; left: 20px; width: 480px; max-height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; scrollbar-width: none; font-size: 22px; }
  .ovl-tl::-webkit-scrollbar { display: none; }
  .ovl-tc { top: 16px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 60vw; pointer-events: none; }
  .ovl-tr { top: 16px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* Size tweaks: left-side body shrunk 25%, right-side controls enlarged 50% (title/connect/gizmo untouched) */
  .ovl-tl .state-rows,
  .ovl-tl .mode-row,
  .ovl-tl .active-cards,
  .ovl-tl .expression-panel { zoom: 0.75; }
  /* Pin state-rows + Expression to sit directly on top of the piano roll */
  .ovl-tl .expression-panel { position: fixed; left: 20px; bottom: 120px; width: 480px; z-index: 3; }
  .ovl-tl .state-rows       { position: fixed; left: 20px; bottom: 420px; width: 480px; z-index: 3; display: flex; flex-direction: column; gap: 4px; }
  .ovl-tr .cube-rotate-ctrl { zoom: 1.5; }
  .ovl-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2; padding: 6px 12px 10px; pointer-events: none; }
  .ovl-section { display: flex; flex-direction: column; gap: 6px; }

  h1.title {
    font-size: 60px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
  }
  .conn-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    margin-top: 8px;
  }
  .conn-row input {
    padding: 7px 12px;
    font-size: 22px;
    width: 360px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: rgba(10, 10, 15, 0.5);
    color: var(--warm);
    font-family: monospace;
    letter-spacing: 1px;
  }
  .conn-row button, .ctrl-btn {
    padding: 8px 20px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: monospace;
    letter-spacing: 1px;
  }
  .conn-row button:hover, .ctrl-btn:hover { color: var(--text); border-color: var(--dim); }
  .conn-row button.connected { color: var(--accent); border-color: var(--accent); }
  #cube-status { font-size: 22px; color: var(--dim); }
  #cube-status.ok { color: var(--accent); }
  #cube-status.err { color: var(--warm); }

  .ws-status-inline {
    font-size: 22px;
    color: var(--dim);
  }
  .ws-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff3333;
    margin-right: 5px;
    vertical-align: middle;
  }
  .ws-dot.connected { background: var(--accent); }
  .header-status {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--dim);
  }
  .header-status .val { color: var(--text); }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .cube-rotate-ctrl {
    display: flex;
    gap: 4px;
    align-items: center;
    background: transparent;
    padding: 0;
    border: none;
    user-select: none;
  }
  .cube-rotate-ctrl .cr-label {
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: 2px;
  }
  .cube-rotate-ctrl button {
    padding: 3px 8px;
    font-size: 10px;
    font-family: monospace;
    font-weight: 600;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
  }
  .cube-rotate-ctrl button:hover { color: var(--text); }
  .cube-rotate-ctrl button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* State rows (left overlay, transparent) */
  .state-rows { display: flex; flex-direction: column; gap: 3px; }
  .state-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 24px;
    background: transparent;
    gap: 10px;
  }
  .state-label { color: var(--dim); text-transform: lowercase; letter-spacing: 0.5px; }
  .state-val { font-weight: 600; color: var(--text); font-size: 22px; }
  .state-val.accent { color: var(--accent); }
  .state-val.accent2 { color: var(--accent2); }
  .state-val.warm { color: var(--warm); }
  .state-val.gold { color: var(--gold); }

  .sub-heading {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    margin: 14px 0 8px;
    text-transform: uppercase;
  }

  /* Sequence Control panel */
  .sequence-panel { grid-column: 1 / -1; }
  .seq-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .seq-controls label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .seq-controls select, .seq-controls input[type="text"] {
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
  }
  .seq-controls select { min-width: 180px; }
  .ctrl-btn.active {
    background: var(--warm);
    color: white;
  }
  .seq-status {
    font-size: 12px;
    color: var(--dim);
    margin-left: auto;
  }
  .seq-status .val { color: var(--accent); font-weight: 600; }

  /* Active vertex indicator in sequence bar */
  .seq-vertex-bar {
    display: flex;
    gap: 4px;
    margin-top: 12px;
  }
  .seq-vertex-pip {
    flex: 1;
    height: 32px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
    transition: all 0.2s;
    position: relative;
  }
  .seq-vertex-pip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--active-glow);
    box-shadow: 0 0 12px var(--active-glow);
  }
  .seq-vertex-pip .pip-complex {
    position: absolute;
    bottom: -14px;
    font-size: 8px;
    color: var(--dim);
    white-space: nowrap;
  }
  .seq-vertex-pip.active .pip-complex { color: var(--text); }

  /* Active vertex + complex cards (bottom-left overlay) */
  .vertex-grid, .complex-grid { display: block; }
  .vertex-card, .complex-card {
    display: none;
    background: rgba(10, 10, 15, 0.55);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 10px;
    text-align: center;
    transition: all 0.25s;
  }
  .vertex-card.active, .complex-card.active {
    display: block;
    border-color: var(--accent);
    background: rgba(0, 255, 136, 0.10);
    box-shadow: 0 0 12px var(--active-glow);
    padding: 8px 12px;
    width: 160px;
    align-self: flex-start;
  }
  .vertex-card.active .intensity-bar { display: none; }
  .vertex-label {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .vertex-param {
    font-size: 27px;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
  }
  .vertex-param .val { color: var(--accent); font-weight: 600; }
  .vertex-param .val { color: var(--text); }
  .vertex-card.active .vertex-param .val { color: #fff; }
  .intensity-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .intensity-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .complex-num {
    font-size: 39px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .complex-name {
    font-size: 22px;
    color: var(--dim);
    line-height: 1.3;
  }

  /* Complex type colors */
  .ct-1 { border-color: #ff4444; color: #ff4444; }
  .ct-2 { border-color: #ffaa22; color: #ffaa22; }
  .ct-3 { border-color: #44cc44; color: #44cc44; }
  .ct-4 { border-color: #44dddd; color: #44dddd; }
  .ct-5 { border-color: #4488ff; color: #4488ff; }
  .ct-6 { border-color: #aa44ff; color: #aa44ff; }
  .ct-7 { border-color: #ff44cc; color: #ff44cc; }
  .ct-8 { border-color: #cccccc; color: #cccccc; }

  /* Sieve — piano roll */
  .sieve-strip {
    display: flex;
    gap: 0;
    height: 52px;
    align-items: stretch;
    pointer-events: auto;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(0, 204, 255, 0.25);
  }
  .sieve-cell {
    flex: 1;
    min-width: 0;
    position: relative;
    height: 100%;
    border-right: 1px solid rgba(0, 0, 0, 0.4);
    transition: background 0.2s, box-shadow 0.2s;
  }
  /* White keys — default */
  .sieve-cell {
    background: rgba(200, 220, 235, 0.10);
  }
  /* Black keys — darker, slightly shorter (top band) */
  .sieve-cell.black {
    background: rgba(0, 0, 0, 0.55);
  }
  .sieve-cell.black::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 62%;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 0 0 2px 2px;
    pointer-events: none;
  }
  /* Octave C gets a left divider line */
  .sieve-cell.octave-start {
    border-left: 1px solid rgba(0, 204, 255, 0.35);
  }
  .sieve-cell.active {
    background: var(--accent2);
    box-shadow: 0 0 12px var(--accent2), inset 0 0 8px rgba(255,255,255,0.3);
  }
  .sieve-cell.active::after {
    background: var(--accent2);
  }
  .sieve-cell.active .sieve-bar {
    background: var(--accent2);
  }
  .sieve-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0;
    background: transparent;
    transition: height 0.3s;
  }
  .sieve-labels {
    display: flex;
    gap: 0;
    margin-top: 3px;
    height: 14px;
  }
  .sieve-labels span {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
    line-height: 14px;
    letter-spacing: 0.5px;
  }
  .sieve-labels span.octave-label {
    color: var(--accent2);
  }
  .sieve-labels span.active { color: var(--accent); }

  /* Hidden (JS still writes to these) */
  .log-panel, .gyro-panel, .sequence-panel, .vertices-panel, .complexes-panel, .spell-panel { display: none !important; }
  /* Keep active vertex/complex cards visible even though grid containers hide by default */
  .ovl-tl .vertex-grid, .ovl-tl .complex-grid { display: block !important; }
  .active-cards { display: flex; flex-direction: column; gap: 6px; }

  .move-log {
    font-size: 12px;
    max-height: 150px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .move-entry {
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    animation: flash-in 0.3s ease-out;
  }
  .move-entry .move-name { color: var(--gold); font-weight: 600; min-width: 30px; }
  .move-entry .move-detail { color: var(--dim); }
  .move-entry .move-vertex { color: var(--accent); font-weight: 600; }

  @keyframes flash-in {
    0% { background: rgba(0, 255, 136, 0.15); }
    100% { background: transparent; }
  }


  /* Permutation display */
  .perm-display {
    display: flex;
    gap: 4px;
    margin-top: 2px;
    flex-wrap: nowrap;
    width: 100%;
  }
  .perm-slot {
    flex: 1;
    min-width: 0;
    height: 44px;
    background: rgba(10, 10, 15, 0.5);
    border: 1px solid var(--border);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 600;
    color: var(--accent);
    transition: all 0.3s;
  }
  /* Make the permutation row stack label above slots so 8 boxes fit */
  .state-row.perm-row {
    flex-direction: column;
    align-items: stretch;
  }
  .state-row.perm-row .state-label { margin-bottom: 2px; }
  .perm-slot.active {
    border-color: var(--accent);
    background: var(--active-glow);
    color: #fff;
  }

  /* === V2 Panels === */

  /* Spell buffer (top-center, transparent) */
  .spell-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .spell-notification {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    min-height: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }
  .spell-notification.active {
    animation: spell-flash 1.5s ease-out forwards;
  }
  @keyframes spell-flash {
    0% { color: #fff; text-shadow: 0 0 12px var(--gold), 0 0 24px var(--gold); }
    100% { color: var(--gold); text-shadow: none; }
  }
  .spell-buffer {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .spell-buffer-move {
    padding: 0;
    font-size: 18px;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text);
    transition: color 0.15s;
    letter-spacing: 2px;
  }
  .spell-buffer-move.matched {
    color: var(--gold);
  }
  .spell-partials {
    font-size: 10px;
    color: var(--dim);
    min-width: 120px;
    text-align: right;
  }
  .spell-partials .partial-name {
    color: var(--text);
    font-weight: 600;
  }
  .spell-partials .partial-bar {
    display: inline-block;
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    margin-left: 4px;
    vertical-align: middle;
    transition: width 0.15s;
  }

  /* Mode badges (left overlay) */
  .mode-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .mode-badge {
    padding: 7px 16px;
    font-size: 22px;
    font-weight: 700;
    border-radius: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: transparent;
  }
  .mode-badge.voice-seq {
    background: rgba(0, 255, 136, 0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .mode-badge.voice-poly {
    background: rgba(0, 204, 255, 0.12);
    border: 1px solid var(--accent2);
    color: var(--accent2);
  }
  .mode-badge.frozen {
    background: rgba(255, 102, 68, 0.12);
    border: 1px solid var(--warm);
    color: var(--warm);
  }
  .mode-badge.palette {
    background: rgba(255, 204, 0, 0.08);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .mode-badge.regime-contemplative {
    background: rgba(0, 255, 136, 0.10);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .mode-badge.regime-conversational {
    background: rgba(255, 204, 0, 0.10);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .mode-badge.regime-burst {
    background: rgba(255, 102, 68, 0.15);
    border: 1px solid var(--warm);
    color: var(--warm);
  }
  .turn-rate-val {
    font-size: 22px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    min-width: 100px;
    text-align: right;
  }
  .scramble-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .scramble-label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .scramble-bar-outer {
    width: 150px;
    height: 10px;
    background: rgba(10,10,15,0.5);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .scramble-bar-inner {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s, background 0.3s;
  }
  .scramble-val {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    min-width: 56px;
  }

  /* Expression overlay (now in left column) */
  .expression-panel {
    background: transparent;
    padding: 0;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .expr-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .expr-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    padding: 2px 0;
  }
  .expr-label {
    font-size: 22px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    flex: 0 0 180px;
  }
  .expr-value {
    font-size: 27px;
    font-weight: 600;
    color: var(--accent);
    font-family: monospace;
    min-width: 90px;
  }
  .expr-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .expr-bar {
    height: 100%;
    width: 0%;
    background: var(--accent2);
    border-radius: 2px;
    transition: width 0.1s;
  }
  .expr-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  .expr-controls button {
    padding: 9px 20px;
    font-size: 22px;
    font-family: monospace;
    font-weight: 600;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 1px;
    align-self: flex-start;
  }
  .expr-controls .smooth-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    color: var(--dim);
  }
  .expr-controls .smooth-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent2);
  }

  /* Spell history toast */
  .spell-history {
    position: fixed;
    top: 60px;
    right: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
  }
  .spell-toast {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    color: var(--bg);
    background: var(--gold);
    border-radius: 4px;
    animation: toast-in 2s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes toast-in {
    0% { opacity: 1; transform: translateX(0); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(20px); }
  }

  /* No data overlay */
  .waiting { display: none; }
  .ovl-legacy { display: none !important; }
  .waiting::after {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-left: 8px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="cube-canvas"></canvas>

<div class="spell-history" id="spell-history"></div>

<!-- Top-left: everything that lives on the left edge -->
<div class="ovl ovl-tl">
  <div class="ovl-section">
    <h1 class="title">XENAKUBE</h1>
    <div class="conn-row">
      <input type="text" id="macAddress" placeholder="AB:12:34:5E:83:F7" value="AB:12:34:5E:83:F7">
      <button id="connectBtn">Connect Cube</button>
    </div>
  </div>

  <div class="state-rows">
    <div class="panel-title">State</div>
    <div class="state-row">
      <span class="state-label">active voice</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { connectGanCube } from 'https://cdn.jsdelivr.net/npm/gan-web-bluetooth@latest/+esm';

// ============================================================
// Constants
// ============================================================

const COMPLEX_SHORT = {
  1: 'pizz scatter',
  2: 'bowed sweep',
  3: 'bowed sustain',
  4: 'harm+legno',
  5: 'wild gliss',
  6: 'ord. gliss',
  7: 'tasto sust.',
  8: 'ponticello',
};

const INTENSITY_LEVELS = { 'p': 0.1, 'mp': 0.25, 'mf': 0.42, 'f': 0.58, 'ff': 0.75, 'fff': 0.92 };

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function semitoneName(s) {
  const midi = 36 + s;
  const octave = Math.floor(midi / 12) - 1;
  return NOTE_NAMES[midi % 12] + octave;
}

// Cube vertex positions (matching group.ts labeling)
const CUBE_VERTS = [
  new THREE.Vector3( 1,  1,  1),  // 0 FTR
  new THREE.Vector3(-1,  1,  1),  // 1 FTL
  new THREE.Vector3(-1,  1, -1),  // 2 BTL
  new THREE.Vector3( 1,  1, -1),  // 3 BTR
  new THREE.Vector3( 1, -1,  1),  // 4 FBR
  new THREE.Vector3(-1, -1,  1),  // 5 FBL
  new THREE.Vector3(-1, -1, -1),  // 6 BBL
  new THREE.Vector3( 1, -1, -1),  // 7 BBR
];

const CUBE_EDGES = [
  [0,1],[1,2],[2,3],[3,0],
  [4,5],[5,6],[6,7],[7,4],
  [0,4],[1,5],[2,6],[3,7],
];

const TETRA_A = [0, 2, 5, 7];
const TETRA_B = [1, 3, 4, 6];

// ============================================================
// Three.js Cube Scene
// ============================================================

const canvas = document.getElementById('cube-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 100);
camera.position.set(4, 3, 4);
camera.lookAt(0, 0, 0);

// Wireframe cube
const edgeGeo = new THREE.BufferGeometry();
const edgePositions = [];
for (const [a, b] of CUBE_EDGES) {
  edgePositions.push(CUBE_VERTS[a].x, CUBE_VERTS[a].y, CUBE_VERTS[a].z);
  edgePositions.push(CUBE_VERTS[b].x, CUBE_VERTS[b].y, CUBE_VERTS[b].z);
}
edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
const edgeMat = new THREE.LineBasicMaterial({ color: 0x333355 });
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

// Tetrahedra wireframes
function makeTetraLines(indices, color) {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < indices.length; i++) {
    for (let j = i + 1; j < indices.length; j++) {
      const a = CUBE_VERTS[indices[i]], b = CUBE_VERTS[indices[j]];
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 }));
}
const tetraALines = makeTetraLines(TETRA_A, 0x00ff88);
const tetraBLines = makeTetraLines(TETRA_B, 0xff6644);
scene.add(tetraALines);
scene.add(tetraBLines);

// Vertex spheres + labels
const vertexMeshes = [];
const vertexLabels = [];

// Active vertex glow ring
const activeRingGeo = new THREE.RingGeometry(0.15, 0.22, 16);
const activeRingMat = new THREE.MeshBasicMaterial({
  color: 0x00ff88,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide,
});
const activeRing = new THREE.Mesh(activeRingGeo, activeRingMat);
activeRing.visible = false;

function makeLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 80;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(text, 64, 2);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.0, 0.625, 1);
  return { sprite, canvas: c, ctx, tex };
}

for (let i = 0; i < 8; i++) {
  const isTetraA = TETRA_A.includes(i);
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: isTetraA ? 0x00ff88 : 0xff6644 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(CUBE_VERTS[i]);
  scene.add(mesh);
  vertexMeshes.push(mesh);

  const label = makeLabel(`K${i + 1}`, isTetraA ? '#00ff88' : '#ff6644');
  label.sprite.position.copy(CUBE_VERTS[i]).addScaledVector(CUBE_VERTS[i].clone().normalize(), 0.55);
  scene.add(label.sprite);
  vertexLabels.push(label);
}

// Rotation group for gyro
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);
cubeGroup.add(edgeLines, tetraALines, tetraBLines, activeRing);
vertexMeshes.forEach(m => cubeGroup.add(m));
vertexLabels.forEach(l => cubeGroup.add(l.sprite));

// Ghost cube — shows the S4 element the gyro is currently snapping to.
// Faint cyan wireframe + 8 small markers, oriented at state.snapQuat.
// When the live cube and ghost overlap → gyro is locked on a snap target.
// When they diverge → drifting toward the next snap (deviation factor).
const ghostGroup = new THREE.Group();
ghostGroup.visible = false;
scene.add(ghostGroup);

const ghostEdgeMat = new THREE.LineBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.35 });
const ghostEdges = new THREE.LineSegments(edgeGeo.clone(), ghostEdgeMat);
ghostGroup.add(ghostEdges);

const ghostVertGeo = new THREE.SphereGeometry(0.05, 6, 6);
const ghostVertMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.55 });
const ghostVertMeshes = [];
const ghostLabels = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(ghostVertGeo.clone(), ghostVertMat.clone());
  m.position.copy(CUBE_VERTS[i]);
  ghostGroup.add(m);
  ghostVertMeshes.push(m);

  const label = makeLabel(`C?`, '#00ccff');
  label.sprite.position.copy(CUBE_VERTS[i]).addScaledVector(CUBE_VERTS[i].clone().normalize(), 0.45);
  label.sprite.scale.set(0.7, 0.44, 1);
  ghostGroup.add(label.sprite);
  ghostLabels.push(label);
}

// OrbitControls for camera mode
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 12;

// Per-cube view offsets (premultiplied onto the live/ghost rotation).
const liveViewOffset = new THREE.Quaternion(0, 0, 0, 1);
const ghostViewOffset = new THREE.Quaternion(0, 0, 0, 1);
let rotateTarget = 'camera'; // 'camera' | 'live' | 'ghost'

// ---- Rotation Gizmo (separate mini-canvas, bottom-right corner) ----
const gizmoCanvas = document.createElement('canvas');
gizmoCanvas.width = 200; gizmoCanvas.height = 200;
gizmoCanvas.style.cssText = 'position:fixed;top:56px;right:20px;width:200px;height:200px;z-index:3;touch-action:none;border-radius:50%;cursor:grab;';
document.body.appendChild(gizmoCanvas);

const gizmoRenderer = new THREE.WebGLRenderer({ canvas: gizmoCanvas, antialias: true, alpha: true });
gizmoRenderer.setPixelRatio(window.devicePixelRatio);
const gizmoScene = new THREE.Scene();
const gizmoCamera = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.1, 100);
gizmoCamera.position.set(3, 2.5, 3);
gizmoCamera.lookAt(0, 0, 0);

const GIZMO_COLORS = { x: 0xff4444, y: 0x44ff44, z: 0x4488ff };
const GIZMO_HIGHLIGHT = { x: 0xff8888, y: 0x88ff88, z: 0x88bbff };
const gizmoAxes = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1),
};
const gizmoRotations = {
  x: new THREE.Euler(0, Math.PI / 2, 0),
  y: new THREE.Euler(Math.PI / 2, 0, 0),
  z: new THREE.Euler(0, 0, 0),
};

const gizmoRings = {};
const gizmoHitRings = {};

for (const axis of ['x', 'y', 'z']) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.04, 12, 64),
    new THREE.MeshBasicMaterial({ color: GIZMO_COLORS[axis], transparent: true, opacity: 0.85, depthTest: false })
  );
  ring.rotation.copy(gizmoRotations[axis]);
  ring.renderOrder = 999;
  ring.userData.axis = axis;
  gizmoScene.add(ring);
  gizmoRings[axis] = ring;

  const hitRing = new THREE.Mesh(
    new THREE.TorusGeometry(1.2, 0.18, 8, 48),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitRing.rotation.copy(gizmoRotations[axis]);
  hitRing.userData.axis = axis;
  gizmoScene.add(hitRing);
  gizmoHitRings[axis] = hitRing;
}

// Axis nubs (small spheres at axis tips with labels)
for (const [axis, color] of Object.entries(GIZMO_COLORS)) {
  const pos = gizmoAxes[axis].clone().multiplyScalar(1.45);
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 8, 8),
    new THREE.MeshBasicMaterial({ color, depthTest: false })
  );
  dot.position.copy(pos);
  dot.renderOrder = 1000;
  gizmoScene.add(dot);

  // Axis letter sprite
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(axis.toUpperCase(), 16, 16);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sprite.position.copy(pos).addScaledVector(gizmoAxes[axis], 0.25);
  sprite.scale.set(0.35, 0.35, 1);
  sprite.renderOrder = 1001;
  gizmoScene.add(sprite);
}

const gizmoRaycaster = new THREE.Raycaster();
const gizmoPointer = new THREE.Vector2();
let gizmoDragging = false;
let gizmoActiveAxis = null;
let gizmoDragAngleStart = 0;

function getGizmoAngle(clientX, clientY) {
  const rect = gizmoCanvas.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  return Math.atan2(clientY - cy, clientX - cx);
}

function hitTestGizmo(clientX, clientY) {
  const rect = gizmoCanvas.getBoundingClientRect();
  gizmoPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  gizmoPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  gizmoRaycaster.setFromCamera(gizmoPointer, gizmoCamera);
  const hits = gizmoRaycaster.intersectObjects(Object.values(gizmoHitRings));
  return hits.length > 0 ? hits[0].object.userData.axis : null;
}

gizmoCanvas.addEventListener('pointerdown', (e) => {
  if (rotateTarget === 'camera') return;
  const axis = hitTestGizmo(e.clientX, e.clientY);
  if (!axis) return;
  e.stopPropagation();
  gizmoDragging = true;
  gizmoActiveAxis = axis;
  gizmoDragAngleStart = getGizmoAngle(e.clientX, e.clientY);
  gizmoCanvas.setPointerCapture(e.pointerId);
  for (const a of ['x', 'y', 'z']) {
    gizmoRings[a].material.color.setHex(a === axis ? GIZMO_HIGHLIGHT[a] : GIZMO_COLORS[a]);
    gizmoRings[a].material.opacity = a === axis ? 1.0 : 0.2;
  }
});

window.addEventListener('pointermove', (e) => {
  if (!gizmoDragging) {
    if (rotateTarget !== 'camera') {
      const rect = gizmoCanvas.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (inside) {
        const axis = hitTestGizmo(e.clientX, e.clientY);
        gizmoCanvas.style.cursor = axis ? 'grab' : 'default';
        for (const a of ['x', 'y', 'z']) {
          gizmoRings[a].material.opacity = (a === axis) ? 1.0 : 0.85;
        }
      }
    }
    return;
  }
  const angle = getGizmoAngle(e.clientX, e.clientY);
  let delta = angle - gizmoDragAngleStart;
  // Wrap delta to avoid jumps crossing ±PI
  if (delta > Math.PI) delta -= 2 * Math.PI;
  if (delta < -Math.PI) delta += 2 * Math.PI;

  // Flip if gizmo camera looks at the negative side of the axis
  const camDir = gizmoCamera.position.clone().normalize();
  if (camDir.dot(gizmoAxes[gizmoActiveAxis]) < 0) delta = -delta;

  gizmoDragAngleStart = angle;
  const offset = (rotateTarget === 'live') ? liveViewOffset : ghostViewOffset;
  offset.premultiply(new THREE.Quaternion().setFromAxisAngle(gizmoAxes[gizmoActiveAxis], -delta));
});

const endGizmoDrag = (e) => {
  if (!gizmoDragging) return;
  gizmoDragging = false;
  gizmoActiveAxis = null;
  gizmoCanvas.style.cursor = 'grab';
  if (gizmoCanvas.hasPointerCapture(e.pointerId)) gizmoCanvas.releasePointerCapture(e.pointerId);
  for (const a of ['x', 'y', 'z']) {
    gizmoRings[a].material.color.setHex(GIZMO_COLORS[a]);
    gizmoRings[a].material.opacity = 0.85;
  }
};
window.addEventListener('pointerup', endGizmoDrag);
window.addEventListener('pointercancel', endGizmoDrag);

// ---- Mode toggle ----
const rotateCtrl = document.getElementById('rotate-ctrl');
rotateCtrl.querySelectorAll('.cr-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    rotateTarget = btn.dataset.target;
    rotateCtrl.querySelectorAll('.cr-btn').forEach(b => b.classList.toggle('active', b === btn));
    controls.enabled = (rotateTarget === 'camera');
    gizmoCanvas.style.opacity = (rotateTarget === 'camera') ? '0.3' : '1';
    gizmoCanvas.style.pointerEvents = (rotateTarget === 'camera') ? 'none' : 'auto';
  });
});
rotateCtrl.querySelector('.cr-reset').addEventListener('click', () => {
  if (rotateTarget === 'live') liveViewOffset.identity();
  else if (rotateTarget === 'ghost') ghostViewOffset.identity();
  else controls.reset();
});
// Initial state: camera mode, gizmo dimmed
gizmoCanvas.style.opacity = '0.3';
gizmoCanvas.style.pointerEvents = 'none';

let idleAngle = 0;
let currentGyro = new THREE.Quaternion(0, 0, 0, 1);
let currentSnap = new THREE.Quaternion(0, 0, 0, 1);
let hasGyro = false;
let hasSnap = false;
let currentActiveVertex = 0;

// Gyro zero calibration
let gyroZeroInv = new THREE.Quaternion(0, 0, 0, 1);

document.getElementById('zeroBtn').addEventListener('click', () => {
  gyroZeroInv.copy(currentGyro).invert();
});

function resizeCube() {
  const rect = canvas.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
resizeCube();
window.addEventListener('resize', resizeCube);

const calibratedGyro = new THREE.Quaternion();
const calibratedSnap = new THREE.Quaternion();

// Pulse animation for active ring
let ringPulse = 0;

function animateCube() {
  requestAnimationFrame(animateCube);
  controls.update();
  if (hasGyro) {
    calibratedGyro.copy(gyroZeroInv).multiply(currentGyro);
  } else {
    idleAngle += 0.003;
    calibratedGyro.setFromEuler(new THREE.Euler(0.3, idleAngle, 0.15));
  }
  cubeGroup.quaternion.copy(liveViewOffset).multiply(calibratedGyro);

  // Ghost cube — same calibration as live cube so they share a frame
  if (hasSnap) {
    ghostGroup.visible = true;
    calibratedSnap.copy(gyroZeroInv).multiply(currentSnap);
    ghostGroup.quaternion.copy(ghostViewOffset).multiply(calibratedSnap);
  } else {
    ghostGroup.visible = false;
  }

  // Pulse active ring
  ringPulse += 0.04;
  if (activeRing.visible) {
    activeRingMat.opacity = 0.4 + 0.3 * Math.sin(ringPulse);
  }

  renderer.render(scene, camera);
  gizmoRenderer.render(gizmoScene, gizmoCamera);
}
animateCube();

function updateActiveVertexIn3D(idx) {
  // Enlarge active vertex sphere, shrink others
  for (let i = 0; i < 8; i++) {
    const scale = (i === idx) ? 2.5 : 1.0;
    vertexMeshes[i].scale.setScalar(scale);
  }
  // Position glow ring at active vertex
  activeRing.visible = true;
  activeRing.position.copy(CUBE_VERTS[idx]);
  activeRing.lookAt(camera.position);
}

const COMPLEX_ABBR = {
  1: 'pizz', 2: 'bow', 3: 'sust', 4: 'harm',
  5: 'glsW', 6: 'glsM', 7: 'glsS', 8: 'pont'
};

function updateVertexLabels(perm, vertices, complexTypes, activeIdx) {
  for (let i = 0; i < 8; i++) {
    const kIndex = perm ? perm[i] : i;
    const isTetraA = TETRA_A.includes(i);
    const isActive = i === activeIdx;
    const color = isActive ? '#ffffff' : (isTetraA ? '#00ff88' : '#ff6644');
    const dimColor = isActive ? '#cccccc' : (isTetraA ? '#00cc66' : '#cc5533');
    const label = vertexLabels[i];
    const ctx = label.ctx;
    const W = 128, H = 80;
    ctx.clearRect(0, 0, W, H);

    // No background pill — active vertex is indicated by the glow ring
    // in the 3D scene and the active-card in the bottom-left overlay.

    // Line 1: K# only. Complex labels live on the GHOST cube — the live
    // cube is the K_i (parameter) domain, the ghost is the C_i (complex)
    // domain. Previously both cubes rendered complex abbreviations, which
    // (together with the engine's old lockstep advance) made it look like
    // `pizz/bow/harm` were glued to K#s. Keep K# exclusive to the live cube.
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`K${kIndex + 1}`, W / 2, 2);

    // Line 2: intensity + density
    if (vertices) {
      const v = vertices[i];
      ctx.font = '14px monospace';
      ctx.fillStyle = dimColor;
      ctx.fillText(`${v.intensity} d${v.density.toFixed(1)}`, W / 2, 24);

      // Line 3: duration
      ctx.fillText(`${v.duration}s`, W / 2, 42);
    }

    label.tex.needsUpdate = true;
  }
}

function updateGhostLabels(complexTypes) {
  for (let i = 0; i < 8; i++) {
    const label = ghostLabels[i];
    const ctx = label.ctx;
    const W = 128, H = 80;
    ctx.clearRect(0, 0, W, H);
    const ct = complexTypes ? complexTypes[i] : null;
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#00ccff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(ct ? `C${ct}` : '?', W / 2, 2);
    if (ct) {
      ctx.font = '12px monospace';
      ctx.fillStyle = '#0099bb';
      ctx.fillText(COMPLEX_ABBR[ct] || '', W / 2, 22);
    }
    label.tex.needsUpdate = true;
  }
}

function updateSnapOverlay(snapElement, deviation) {
  const snapVal = document.getElementById('s-snap');
  if (snapElement != null) {
    if (snapVal) snapVal.textContent = `S4 #${snapElement}`;
    // Ghost opacity: more opaque when locked, faint when drifting
    const ghostOpacity = 0.15 + 0.55 * (1 - deviation);
    ghostEdgeMat.opacity = ghostOpacity;
    ghostVertMeshes.forEach(m => { m.material.opacity = ghostOpacity + 0.1; });
    ghostLabels.forEach(l => { l.sprite.material.opacity = ghostOpacity + 0.2; });
  }
}

// ============================================================
// State Update
// ============================================================

let moveCount = 0;

function updateState(state, move) {
  const activeIdx = state.activeVertex ?? 0;
  currentActiveVertex = activeIdx;

  document.getElementById('s-step').textContent = state.step;
  document.getElementById('s-path').textContent = state.path;

  document.getElementById('s-k-group').textContent = state.kGroup;
  document.getElementById('s-tetra').textContent = state.tetraIndex === 0 ? 'even' : 'odd';
  document.getElementById('s-tetra').className = 'state-val ' + (state.tetraIndex === 0 ? 'accent' : 'warm');
  document.getElementById('s-cycle').textContent = state.cyclicPhase;
  const activeKIdx = state.kPermutation ? state.kPermutation[activeIdx] : activeIdx;
  document.getElementById('s-active-vertex').textContent = `K${activeKIdx + 1}`;

  if (state.kPermutation) {
    for (let i = 0; i < 8; i++) {
      permSlots[i].textContent = state.kPermutation[i] + 1;
      permSlots[i].className = 'perm-slot' + (i === activeIdx ? ' active' : '');
    }
  }

  tetraALines.material.opacity = state.tetraIndex === 0 ? 0.6 : 0.15;
  tetraBLines.material.opacity = state.tetraIndex === 1 ? 0.6 : 0.15;

  if (state.kVertices) {
    // state.kVertices[i] = basevertices[perm[i]] — already permuted. The card
    // at screen-position i must therefore be labelled with the K-number of
    // whichever vertex currently occupies that position, i.e. perm[i]+1. The
    // old static `K${i+1}` label showed the slot position instead of the
    // vertex identity, so e.g. K2's values could appear under a card labelled
    // K3. Rename on every render.
    for (let i = 0; i < 8; i++) {
      const v = state.kVertices[i];
      const card = vertexCards[i];
      const kIdx = state.kPermutation ? state.kPermutation[i] : i;
      card.querySelector('.vertex-label').textContent = `K${kIdx + 1}`;
      card.querySelector('[data-v="d"]').textContent = v.density.toFixed(1);
      card.querySelector('[data-v="g"]').textContent = v.intensity;
      card.querySelector('[data-v="u"]').textContent = v.duration;
      const pct = (INTENSITY_LEVELS[v.intensity] || 0.5) * 100;
      card.querySelector('[data-v="bar"]').style.width = pct + '%';
      card.className = 'vertex-card' + (i === activeIdx ? ' active' : ' inactive');
    }
  }

  if (state.cAssignments) {
    for (let i = 0; i < 8; i++) {
      const ct = state.cAssignments[i];
      const card = complexCards[i];
      const isActive = i === activeIdx;
      card.className = `complex-card ct-${ct}` + (isActive ? ' active' : ' inactive');
      card.querySelector('.complex-num').textContent = `C${ct}`;
      card.querySelector('.complex-name').textContent = COMPLEX_SHORT[ct] || '';
    }

    for (let i = 0; i < 8; i++) {
      const ct = state.cAssignments[i];
      const kIdx = state.kPermutation ? state.kPermutation[i] : i;
      seqPips[i].className = 'seq-vertex-pip' + (i === activeIdx ? ' active' : '');
      // Keep the pip's K-label in sync with whichever vertex currently sits
      // in this slot (same fix as vertex cards above). Re-create the inner
      // HTML since the K-number prefix is a plain text node.
      seqPips[i].innerHTML = `K${kIdx + 1}<span class="pip-complex">${COMPLEX_SHORT[ct] || ''}</span>`;
    }
  }

  // Update 3D cube labels with full vertex params
  updateVertexLabels(
    state.kPermutation,
    state.kVertices || null,
    state.cAssignments || null,
    activeIdx
  );
  updateActiveVertexIn3D(activeIdx);

  const activeSet = new Set(state.sieve);
  for (let i = 0; i < SIEVE_RANGE; i++) {
    const isActive = activeSet.has(i);
    sieveCells[i].className = 'sieve-cell' + (isActive ? ' active' : '');
    sieveCells[i].querySelector('.sieve-bar').style.height = isActive ? '100%' : '0';
    const lbl = sieveLabelsEl.children[i];
    if (lbl) lbl.className = isActive ? 'active' : '';
  }

  if (state.gyro) {
    const [x, y, z, w] = state.gyro;
    currentGyro.set(-x, z, y, w);
    hasGyro = true;
  }

  if (state.snapQuat) {
    const [sx, sy, sz, sw] = state.snapQuat;
    currentSnap.set(-sx, sz, sy, sw);
    hasSnap = true;
    updateGhostLabels(state.cAssignments);
    updateSnapOverlay(state.snapElement, state.gyroDeviation ?? 0);
  }

  if (move) {
    const waiting = document.getElementById('waiting-msg');
    if (waiting) waiting.remove();

    moveCount++;
    const log = document.getElementById('move-log');
    const entry = document.createElement('div');
    entry.className = 'move-entry';
    const ct = state.cAssignments ? state.cAssignments[activeIdx] : '?';
    entry.innerHTML = `
      <span class="move-name">${move}</span>
      <span class="move-vertex">K${activeKIdx + 1}</span>
      <span class="move-detail">C${ct} ${state.cyclicPhase} step ${state.step}</span>
    `;
    log.insertBefore(entry, log.firstChild);
    while (log.children.length > 50) log.removeChild(log.lastChild);
  }
}


// ============================================================
// V2: Spell, Mode, Expression, Scramble
// ============================================================

let spellBook = [];
let spellNotificationTimeout = null;

function updateV2State(state) {
  // Scramble
  if (typeof state.scrambleFactor === 'number') {
    const sf = state.scrambleFactor;
    const bar = document.getElementById('scramble-bar');
    const val = document.getElementById('scramble-val');
    bar.style.width = (sf * 100) + '%';
    // Green (solved) → red (scrambled)
    const hue = 140 - sf * 140;
    bar.style.background = `hsl(${hue}, 70%, 50%)`;
    val.textContent = sf.toFixed(2);

    // Expression scramble
    document.getElementById('expr-scramble').textContent = sf.toFixed(2);
    document.getElementById('expr-scramble-bar').style.width = (sf * 100) + '%';
  }

  // Voice mode
  if (state.voiceMode) {
    const badge = document.getElementById('mode-voice');
    if (state.voiceMode === 'polyphonic') {
      badge.textContent = 'POLYPHONIC';
      badge.className = 'mode-badge voice-poly';
    } else {
      badge.textContent = 'SEQUENTIAL';
      badge.className = 'mode-badge voice-seq';
    }
  }

  // Performance mode
  if (state.performanceMode) {
    const pm = state.performanceMode;
    document.getElementById('mode-palette').textContent = pm.palette;
  }

  // Regime + turn rate
  if (state.regime) {
    const badge = document.getElementById('mode-regime');
    badge.textContent = state.regime.toUpperCase();
    badge.className = 'mode-badge regime-' + state.regime;
  }
  if (typeof state.turnRate === 'number') {
    document.getElementById('turn-rate-val').textContent = state.turnRate.toFixed(1) + ' t/s';
  }

  // Spell buffer visualization
  if (state.spellBuffer) {
    const bufEl = document.getElementById('spell-buffer');
    // Find which moves in the buffer are part of a partial match
    const matchedIndices = new Set();
    if (state.spellPartials && state.spellPartials.length > 0) {
      // Highlight the trailing N moves that match the best partial
      const best = state.spellPartials.reduce((a, b) =>
        (b.matched / b.total) > (a.matched / a.total) ? b : a
      );
      const start = state.spellBuffer.length - best.matched;
      for (let i = start; i < state.spellBuffer.length; i++) {
        matchedIndices.add(i);
      }
    }

    bufEl.innerHTML = '';
    for (let i = 0; i < state.spellBuffer.length; i++) {
      const el = document.createElement('span');
      el.className = 'spell-buffer-move' + (matchedIndices.has(i) ? ' matched' : '');
      el.textContent = state.spellBuffer[i];
      bufEl.appendChild(el);
    }
  }

  // Partial matches display
  if (state.spellPartials) {
    const partialsEl = document.getElementById('spell-partials');
    if (state.spellPartials.length > 0) {
      const best = state.spellPartials
        .sort((a, b) => (b.matched / b.total) - (a.matched / a.total))
        .slice(0, 2);
      partialsEl.innerHTML = best.map(p => {
        const pct = Math.round((p.matched / p.total) * 100);
        const barW = Math.round((p.matched / p.total) * 40);
        return `<span class="partial-name">${p.name}</span> ${p.matched}/${p.total} <span class="partial-bar" style="width:${barW}px"></span>`;
      }).join('<br>');
    } else {
      partialsEl.innerHTML = '';
    }
  }

  // Expression: deviation is already in gyroDeviation
  if (typeof state.gyroDeviation === 'number') {
    document.getElementById('expr-dev').textContent = state.gyroDeviation.toFixed(2);
    document.getElementById('expr-dev-bar').style.width = (state.gyroDeviation * 100) + '%';
  }
}

function handleSpellEvent(data) {
  // Toast notification
  const history = document.getElementById('spell-history');
  const toast = document.createElement('div');
  toast.className = 'spell-toast';
  toast.textContent = data.name.toUpperCase();
  history.appendChild(toast);
  setTimeout(() => toast.remove(), 2100);

  // In-panel notification
  const notifEl = document.getElementById('spell-notification');
  notifEl.textContent = data.name.toUpperCase();
  notifEl.className = 'spell-notification active';
  if (spellNotificationTimeout) clearTimeout(spellNotificationTimeout);
  spellNotificationTimeout = setTimeout(() => {
    notifEl.className = 'spell-notification';
  }, 1500);
}

// Tilt and spin are derived from gyro quaternion client-side
// (faster than waiting for relay to compute + broadcast at 60Hz)
let prevGyroQuat = [0, 0, 0, 1];
let prevGyroTime = 0;

function computeLocalExpression(gyro) {
  if (!gyro) return;
  const [x, y, z, w] = gyro;
  const now = performance.now();

  // Tilt (pitch angle from quaternion)
  const sinP = 2 * (w * x - y * z);
  const pitch = Math.asin(Math.max(-1, Math.min(1, sinP)));
  const tilt = (pitch + Math.PI / 2) / Math.PI;

  document.getElementById('expr-tilt').textContent = tilt.toFixed(2);
  document.getElementById('expr-tilt-bar').style.width = (tilt * 100) + '%';

  // Spin (angular velocity)
  const dt = (now - prevGyroTime) / 1000;
  if (dt > 0 && dt < 1 && prevGyroTime > 0) {
    const dot = Math.abs(prevGyroQuat[0]*x + prevGyroQuat[1]*y + prevGyroQuat[2]*z + prevGyroQuat[3]*w);
    const angle = 2 * Math.acos(Math.min(1, dot));
    const angularVel = angle / dt;
    const spin = Math.min(1, angularVel / 6);
    document.getElementById('expr-spin').textContent = spin.toFixed(2);
    document.getElementById('expr-spin-bar').style.width = (spin * 100) + '%';
  }

  prevGyroQuat = [x, y, z, w];
  prevGyroTime = now;
}

// ============================================================
// WebSocket — receives state broadcasts from relay
// ============================================================

// ws status indicators were removed from the UI; stub out the refs so the
// existing onopen/onclose handlers don't need to branch.
const dot = { classList: { add() {}, remove() {} } };
const wsStatusEl = { set textContent(_v) {} };
let ws;
let gyroThrottleFrame = null;
let pendingGyroState = null;

function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function wsConnect() {
  ws = new WebSocket('ws://' + window.location.host);

  ws.onopen = () => {
    dot.classList.add('connected');
    wsStatusEl.textContent = 'connected';
    // Request diagram list
    wsSend({ type: 'get_diagrams' });
  };

  ws.onclose = () => {
    dot.classList.remove('connected');
    wsStatusEl.textContent = 'reconnecting...';
    setTimeout(wsConnect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'state') {
        updateState(msg.data, msg.move);
        updateV2State(msg.data);
        computeLocalExpression(msg.data.gyro);
      } else if (msg.type === 'gyro_state') {
        pendingGyroState = msg.data;
        if (!gyroThrottleFrame) {
          gyroThrottleFrame = requestAnimationFrame(() => {
            if (pendingGyroState) {
              updateState(pendingGyroState, null);
              updateV2State(pendingGyroState);
              computeLocalExpression(pendingGyroState.gyro);
              pendingGyroState = null;
            }
            gyroThrottleFrame = null;
          });
        }
      } else if (msg.type === 'diagrams') {
        populateDiagramSelect(msg.data);
      } else if (msg.type === 'spell') {
        handleSpellEvent(msg.data);
      } else if (msg.type === 'spell_book') {
        spellBook = msg.data;
      }
    } catch (e) {
      console.error('Parse error:', e);
    }
  };
}

wsConnect();

// Sequence Control Handlers

const diagramSelect = document.getElementById('diagram-select');
const pathSelect = document.getElementById('path-select');
const cmodeSelect = document.getElementById('cmode-select');
const resetBtn = document.getElementById('resetBtn');

function populateDiagramSelect(diagrams) {
  // Keep the "direct" option, add diagram options
  while (diagramSelect.options.length > 1) diagramSelect.remove(1);
  for (const d of diagrams) {
    const opt = document.createElement('option');
    opt.value = d.name;
    opt.textContent = `${d.name} (${d.path.length} steps)`;
    diagramSelect.appendChild(opt);
  }
}

diagramSelect.addEventListener('change', () => {
  const name = diagramSelect.value;
  if (name) {
    wsSend({ type: 'set_diagram', name });
  } else {
    wsSend({ type: 'clear_diagram' });
  }
});

pathSelect.addEventListener('change', () => {
  wsSend({ type: 'set_mode', path: pathSelect.value });
});

cmodeSelect.addEventListener('change', () => {
  wsSend({ type: 'set_mode', cCube: cmodeSelect.value });
});

resetBtn.addEventListener('click', () => {
  wsSend({ type: 'reset' });
});

const gyroSmoothSlider = document.getElementById('gyroSmoothing');
const gyroSmoothVal = document.getElementById('gyroSmoothVal');
gyroSmoothSlider.addEventListener('input', () => {
  const val = parseFloat(gyroSmoothSlider.value);
  gyroSmoothVal.textContent = val.toFixed(2);
  wsSend({ type: 'set_gyro_smoothing', value: val });
});

// ============================================================
// Cube BLE Connection (Web Bluetooth)
// ============================================================

// #cube-status span was removed; stub so existing assignments don't crash.
const cubeStatus = { set textContent(_v) {}, set className(_v) {} };
const connectBtn = document.getElementById('connectBtn');
const macInput = document.getElementById('macAddress');

if (localStorage.getItem('ganMacAddress')) {
  macInput.value = localStorage.getItem('ganMacAddress');
}

connectBtn.addEventListener('click', async () => {
  const macAddress = macInput.value.trim().toUpperCase();
  const macRegex = /^([0-9A-F]{2}[:-]){5}([0-9A-F]{2})$/;
  if (!macRegex.test(macAddress)) {
    cubeStatus.textContent = 'invalid MAC';
    cubeStatus.className = 'err';
    return;
  }

  localStorage.setItem('ganMacAddress', macAddress);
  cubeStatus.textContent = 'select cube in popup...';
  cubeStatus.className = '';
  connectBtn.disabled = true;

  try {
    const cube = await connectGanCube(async (device, isFallbackCall) => {
      return macAddress;
    });

    cubeStatus.textContent = 'connected';
    cubeStatus.className = 'ok';
    connectBtn.textContent = 'Connected';
    connectBtn.classList.add('connected');
    connectBtn.disabled = true;

    cube.events$.subscribe((event) => {
      if (event.type === 'MOVE') {
        wsSend({ type: 'move', value: event.move });
      } else if (event.type === 'GYRO' || event.type === 'GYROSCOPE' || event.gyro) {
        wsSend({ type: 'gyro', data: event.gyro || event });
      } else if (event.type === 'DISCONNECT') {
        cubeStatus.textContent = 'disconnected';
        cubeStatus.className = 'err';
        connectBtn.textContent = 'Connect Cube';
        connectBtn.classList.remove('connected');
        connectBtn.disabled = false;
      }
    });

  } catch (err) {
    console.error('Cube connect error:', err);
    cubeStatus.textContent = 'failed: ' + err.message;
    cubeStatus.className = 'err';
    connectBtn.disabled = false;
  }
});
