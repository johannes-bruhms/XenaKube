function _buildGlissSegments(nodes) {
  const segs = [];
  if (nodes.length === 0) return segs;
  // First note: stationary at p0 (no portamento yet).
  segs.push({ t0: nodes[0].evt.onsetMs, dur: 0, p0: nodes[0].evt.pitch, p1: nodes[0].evt.pitch });
  for (let i = 1; i < nodes.length; i++) {
    const n = nodes[i].evt;
    const startT = n.onsetMs;
    // Pitch handed off from the prior portamento at the moment this
    // noteon arrives — this is what SWAM's portamento engine would itself
    // be at when retargeted, so the visual curve matches the audio.
    const pitchAtStart = _glissPitchAt(startT, segs);
    segs.push({
      t0: startT,
      dur: _glissChainDur(pitchAtStart, n.pitch, n.complex),
      p0:  pitchAtStart,
      p1:  n.pitch,
    });
  }
  return segs;
}

function drawGlissChain(ctx, chain, nowMs, canvasW, canvasH) {
  const { complex, color, nodes } = chain;
  if (nodes.length === 0) return;
  const segs = _buildGlissSegments(nodes);
  const lineW = bu(0.85);

  // Sample the audible pitch trajectory across the chain's full X span
  // and stroke as a polyline. Because pitch is computed from the segment
  // model (not from per-note flat bodies + slant transitions), the result
  // is one continuous smoothstep wave through every slide — no sharp
  // 90° corners between body and transition, no narrow Bezier squeezed
  // into the bridge's 20 ms overlap window. Sample density of 3 device
  // px is dense enough that lineJoin: 'round' makes the polyline
  // visually smooth without bezier overhead.
  const startX = nodes[0].x0;
  const endX   = nodes[nodes.length - 1].x1;
  const span   = Math.max(1, endX - startX);
  const samplePx = 3 * rollDpr;
  const numSamples = Math.max(2, Math.ceil(span / samplePx));
  const pxPerMs = ROLL_PX_PER_SEC * rollDpr / 1000;
  const rightEdge = rollRightEdge(canvasW);

  const strokePath = (dy, w, alpha) => {
    ctx.strokeStyle = color;
    ctx.lineWidth   = w;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    for (let i = 0; i <= numSamples; i++) {
      const x = startX + span * i / numSamples;
      const t = nowMs - (rightEdge - x) / pxPerMs;
      const p = _glissPitchAt(t, segs);
      const y = midiToY(p, canvasH);
      if (i === 0) ctx.moveTo(x, y + dy);
      else         ctx.lineTo(x, y + dy);
    }
    ctx.stroke();
  };

  // C7 smoke: faint halo strokes above and below the main path. Drawn
  // first so the main stroke layers over them.
  if (complex === 7) {
    const haloOffset = lineW * 1.2;
    strokePath(-haloOffset, lineW * 0.5, 0.22);
    strokePath(+haloOffset, lineW * 0.5, 0.22);
  }
  strokePath(0, lineW, 0.95);
  ctx.globalAlpha = 1;
}

function drawRollingScore() {
  if (!rollCanvas || !rollCtx) {
    requestAnimationFrame(drawRollingScore);
    return;
  }
  const w = rollCanvas.width;
  const h = rollCanvas.height;
  const nowMs = performance.now();
  // Recompute the brush sizing unit (device-px per semitone) from the current
  // viewport so brushes scale with the available pitch density. Floor at
  // 4 device px so brushes don't vanish on absurdly small windows.
  const innerHDev = Math.max(48 * rollDpr, h - (ROLL_TOP_INSET_PX + ROLL_BOTTOM_INSET_PX) * rollDpr);
  rollRowH = Math.max(4 * rollDpr, innerHDev / ROLL_PITCH_RANGE);
  // Visible time window depends on canvas width (in CSS px); cull anything
  // that's already scrolled off the left edge plus a small grace.
  const visibleSec = (w / rollDpr) / ROLL_PX_PER_SEC;
  const horizonMs = nowMs - visibleSec * 1000;

  rollCtx.clearRect(0, 0, w, h);

  // Cull finished notes that have scrolled fully off the left edge
  while (finishedMidiNotes.length && finishedMidiNotes[0].offsetMs < horizonMs - 500) {
    finishedMidiNotes.shift();
  }

  // Notes — finished first (lower z), then in-flight on top.
  // Per-complex brush rendering via drawNote → COMPLEX_BRUSH dispatch.
  for (const evt of finishedMidiNotes) {
    const x0 = timeToX(evt.onsetMs,  nowMs, w);
    const x1 = timeToX(evt.offsetMs, nowMs, w);
    const y  = midiToY(evt.pitch, h);
    const alpha = 0.55 + 0.45 * Math.min(1, evt.velocity / 110);
    drawNote(rollCtx, evt, x0, x1, y, alpha);
  }
  const rightEdge = rollRightEdge(w);
  for (const queue of activeMidiNotes.values()) {
    for (const evt of queue) {
      const x0 = timeToX(evt.onsetMs, nowMs, w);
      const y  = midiToY(evt.pitch, h);
      const alpha = 0.7 + 0.3 * Math.min(1, evt.velocity / 110);
      drawNote(rollCtx, evt, x0, rightEdge, y, alpha);
    }
  }

  // Gliss chains — each (voice, complex) chain of consecutive gliss notes
  // is drawn as a single Path2D so junctions are seamless and the line
  // reads as one fluid brush stroke.
  const chains = buildGlissChains(nowMs, w, h);
  for (const chain of chains) drawGlissChain(rollCtx, chain, nowMs, w, h);

  // Phase 1 Visual Invariant — gliss-line trajectory ↔ rolling-chain
  // trajectory drift. Throttled to ~1 Hz; silent unless any gliss line is
  // active (mid-slide OR instant-snap). See assertGlissSync below.
  assertGlissSync(nowMs);

  requestAnimationFrame(drawRollingScore);
}

// Phase 1 Visual Invariant — gliss-line ↔ rolling-chain trajectory.
// The white triangle leg endpoint Y (drawLineOverlay's per-frame `pitch`
// derived from `lineNotes` + easeSlide) and the rolling-score gliss-chain
// polyline Y (drawGlissChain's segment-model `_glissPitchAt`) MUST plot
// the same audible pitch curve at every frame to ≤1 px drift. They share
// the same easing (`easeSlide` ≡ `_glissEase`, both cubic smoothstep) and
// the same per-complex portamento times (PORTAMENTO_MS_PER_SEMITONE ≡
// GLISS_PORTAMENTO_MS_PER_SEMITONE). They diverge only if a refactor
// alters one without the other — exactly the silent-failure mode this
// assertion exists to catch.
//
// Sampled at ~1 Hz so live performance isn't paying for the segment
// rebuild every frame; gated to "any active gliss line exists" so we
// don't fire on the trivial-easy case (no live gliss to compare).
// Compares both mid-slide (animDurMs > 0) and instant-snap (animDurMs
// = 0, post-leap or post-chain-start) line states against the chain.
// Both sides go through the SAME midiToY so this assertion isolates
// trajectory drift only — pitch-axis drift is the separate Phase 1
// sieve / pitch-axis assertion's job.
let _glissSyncLastCheckMs = 0;
const GLISS_SYNC_CHECK_INTERVAL_MS = 1000;

// Replay just the latest chain (same voice + complex; gap ≤ GLISS_GAP_MS).
// Mirrors the chain-grouping rule in buildGlissChains. Returns an array of
// `{ evt }` shaped like buildGlissChains' chain.nodes so _buildGlissSegments
// can consume it directly.
function _findActiveGlissChain(voice, complex, nowMs) {
  const evts = [];
  for (const evt of finishedMidiNotes) {
    if (evt.voice === voice && evt.complex === complex) evts.push(evt);
  }
  for (const queue of activeMidiNotes.values()) {
    for (const evt of queue) {
      if (evt.voice === voice && evt.complex === complex) evts.push(evt);
    }
  }
  if (evts.length === 0) return null;
  evts.sort((a, b) => a.onsetMs - b.onsetMs);
  let start = 0;
  for (let i = 1; i < evts.length; i++) {
    // Primary: chainStart (live-entry classifier set at noteon receive
    // time) — robust against voice steal where gap ≈ 0 ms. Fallback:
    // GLISS_GAP_MS gap-magnitude (catches UDP reorders where the prior
    // noteoff arrives after the new noteon and the live-entry check
    // would have spuriously read "still active").
    const prevOff = evts[i - 1].offsetMs ?? nowMs;
    if (evts[i].chainStart || (evts[i].onsetMs - prevOff > GLISS_GAP_MS)) start = i;
  }
  const out = [];
  for (let i = start; i < evts.length; i++) out.push({ evt: evts[i] });
  return out;
}

function assertGlissSync(nowMs) {
  if (nowMs - _glissSyncLastCheckMs < GLISS_SYNC_CHECK_INTERVAL_MS) return;
  if (!rollCanvas) return;
  // Find any active gliss line (mid-slide AND instant-snap states are
  // both checked — the line and chain must agree at every gliss-active
  // moment, not only when the line is interpolating).
  let line = null;
  for (const ln of lineNotes) {
    if (ln.isGliss) { line = ln; break; }
  }
  if (!line) return;
  _glissSyncLastCheckMs = nowMs;

  const chainNodes = _findActiveGlissChain(line.voice, line.complex, nowMs);
  if (!chainNodes || chainNodes.length === 0) return;
  const segs = _buildGlissSegments(chainNodes);
  if (segs.length === 0) return;

  const linePitch  = _displayedPitch(line, nowMs);
  const chainPitch = _glissPitchAt(nowMs, segs);
  // Both pitches go through the SAME midiToY → drift is purely trajectory
  // (segment-model) drift. Output in CSS px so the threshold matches the
  // CLAUDE.md "≤1 px" wording (1 CSS px is what the eye sees regardless
  // of dpr).
  const lineY  = midiToY(linePitch,  rollCanvas.height) / rollDpr;
  const chainY = midiToY(chainPitch, rollCanvas.height) / rollDpr;
  const drift  = Math.abs(lineY - chainY);
  if (drift > 1) {
    console.error(
      'GLISS SYNC FAIL voice=' + line.voice + ' complex=' + line.complex +
      ' line=' + lineY.toFixed(2) + 'px chain=' + chainY.toFixed(2) + 'px' +
      ' drift=' + drift.toFixed(2) + 'px linePitch=' + linePitch.toFixed(2) +
      ' chainPitch=' + chainPitch.toFixed(2)
    );
  }
}

// ---- Sieve-cell emanation glow ---------------------------------------------
// The glow envelope follows the actual noteon→noteoff window so each cell's
// pulse "speaks" the technique:
//   • sustained held note  → glow holds at peak with a subtle flicker for the
//                            full sounding duration, then exponential release
//   • staccato pizz        → no flicker, peak-boosted by velocity, short
//                            release; bright snap on the cell
//   • tremolo (C8)         → fast flicker matching the bow tremolo rate
//   • gliss (C5/C6/C7)     → smooth hold, no flicker, fast release
//
// `peakBoost` multiplies the velocity-derived base peak (clamped to 1.0).
// `flickerHz` / `flickerDepth` set the during-sustain modulation (depth 0
// disables flicker entirely). `releaseMs` is the exp-decay time-constant
// after noteoff. Profiles per SWAM complex; index 0 = unknown.
const COMPLEX_GLOW = {
  0: { flickerHz: 4.0,  flickerDepth: 0.12, peakBoost: 1.00, releaseMs: 380 },
  1: { flickerHz: 0.0,  flickerDepth: 0.00, peakBoost: 1.45, releaseMs: 130 },  // pizz   — punchy snap
  2: { flickerHz: 4.5,  flickerDepth: 0.18, peakBoost: 1.00, releaseMs: 420 },  // bow    — breathing cloud
  3: { flickerHz: 3.0,  flickerDepth: 0.10, peakBoost: 0.95, releaseMs: 600 },  // sust   — long held flat
  4: { flickerHz: 7.5,  flickerDepth: 0.22, peakBoost: 1.20, releaseMs: 380 },  // harm   — bright twinkle
  5: { flickerHz: 0.0,  flickerDepth: 0.00, peakBoost: 1.00, releaseMs: 280 },  // gliss  — smooth hold
  6: { flickerHz: 0.0,  flickerDepth: 0.00, peakBoost: 1.00, releaseMs: 280 },  // gliss
  7: { flickerHz: 1.5,  flickerDepth: 0.10, peakBoost: 0.95, releaseMs: 350 },  // smoke  — slow waver
  8: { flickerHz: 13.0, flickerDepth: 0.40, peakBoost: 1.05, releaseMs: 240 },  // trem   — fast bow-rate flicker
};
// Shortest perceivable on-state for a near-instant note (bridge can emit
// noteon→noteoff within a frame for very short pizz). Without this floor
// a 1-frame note paints, decays, and disappears within the same vsync.
const GLOW_MIN_VISIBLE_MS = 90;
// Per-cell glow state. cellGlows.get(i) → { onsetMs, peak, flickerHz,
// flickerDepth, releaseMs, sustaining, releaseStart, refCount }. refCount
// tracks how many concurrent voices are holding this cell so the release
// only kicks in when the last voice lifts.
const cellGlows = new Map();

function _glowCellIdx(pitch) {
  if (typeof pitch !== 'number' || !isFinite(pitch)) return -1;
  return Math.max(0, Math.min(SIEVE_RANGE - 1, (pitch | 0) - 36));
}

function startGlow(pitch, velocity, complex) {
  const i = _glowCellIdx(pitch);
  if (i < 0) return;
  const profile = COMPLEX_GLOW[complex] || COMPLEX_GLOW[0];
  const v = Math.max(0, Math.min(127, +velocity || 0)) / 110;
  // sqrt() for perceptual linearity at low velocities; floor 0.45 so
  // even a pp note has a visible glow.
  const peakBase = Math.min(1, 0.45 + 0.55 * Math.sqrt(v));
  const peak = Math.min(1, peakBase * profile.peakBoost);
  const now = performance.now();
  const existing = cellGlows.get(i);
  if (existing) {
    existing.peak = Math.max(existing.peak, peak);
    existing.onsetMs = now;                      // reset flicker phase
    existing.flickerHz = profile.flickerHz;      // newest voice's profile wins
    existing.flickerDepth = profile.flickerDepth;
    existing.releaseMs = profile.releaseMs;
    existing.sustaining = true;
    existing.refCount = (existing.refCount || 0) + 1;
    return;
  }
  cellGlows.set(i, {
    onsetMs: now,
    peak,
    flickerHz: profile.flickerHz,
    flickerDepth: profile.flickerDepth,
    releaseMs: profile.releaseMs,
    sustaining: true,
    releaseStart: 0,
    refCount: 1,
  });
}

function endGlow(pitch) {
  const i = _glowCellIdx(pitch);
  if (i < 0) return;
  const g = cellGlows.get(i);
  if (!g) return;
  g.refCount = Math.max(0, (g.refCount || 0) - 1);
  if (g.refCount > 0) return;
  if (g.sustaining) {
    g.sustaining = false;
    // Defer the release start so the cell stays lit at peak for at least
    // GLOW_MIN_VISIBLE_MS — covers single-frame staccatos that would
    // otherwise be inaudible to the eye.
    const minRelease = g.onsetMs + GLOW_MIN_VISIBLE_MS;
    g.releaseStart = Math.max(performance.now(), minRelease);
  }
}

function clearAllGlows() {
  cellGlows.clear();
  for (let i = 0; i < sieveCells.length; i++) {
    sieveCells[i].style.removeProperty('--glow-opacity');
  }
}

function tickGlows() {
  const now = performance.now();
  let toDelete = null;
  for (const [i, g] of cellGlows) {
    let intensity;
    if (g.sustaining || now < g.releaseStart) {
      // Held — peak with optional flicker. Use |sin| so the modulation
      // never drops below (1 - depth) — a held note shouldn't blink off,
      // only ripple.
      const dt = (now - g.onsetMs) / 1000;
      const flicker = g.flickerDepth > 0
        ? (1 - g.flickerDepth) + g.flickerDepth * Math.abs(Math.sin(2 * Math.PI * g.flickerHz * dt))
        : 1;
      intensity = g.peak * flicker;
    } else {
      // Exponential release. tau ≈ releaseMs · 0.7 → ~99% decay at 3·tau.
      const dt = now - g.releaseStart;
      const k = Math.exp(-dt / (g.releaseMs * 0.7));
      intensity = g.peak * k;
      if (intensity < 0.004) {
        if (!toDelete) toDelete = [];
        toDelete.push(i);
        continue;
      }
    }
    sieveCells[i].style.setProperty('--glow-opacity', intensity.toFixed(3));
  }
  if (toDelete) {
    for (const i of toDelete) {
      cellGlows.delete(i);
      sieveCells[i].style.removeProperty('--glow-opacity');
    }
  }
  requestAnimationFrame(tickGlows);
}
requestAnimationFrame(tickGlows);
// ---- /Sieve-cell emanation glow --------------------------------------------

// ---- Triangle leg lines (K → sieve cell, C → sieve cell) -------------------
// For every active note, two white lines extend from the active K-vertex and
// its nearest ghost C-vertex out to the left edge of the matching sieve cell.
// Combined with the existing K↔C 3D line they form a triangle per note;
// double-stops produce two triangles sharing the K↔C edge. The triangle
// morphs in real-time:
//   • K and C positions move as the cube rotates (gyro / view-offset)
//   • Sieve endpoint moves as the active note's pitch changes
//   • For C5/C6/C7 gliss: the endpoint smoothly interpolates between
//     consecutive noteons over GLISS_INTERP_MS so the leg slides cell-to-
//     cell at SWAM's portamento rate instead of jumping at the discrete
//     MIDI rate
//   • Lines are white at full alpha during sustain, fade with the same
//     exp-release τ as the cell glow after noteoff (lifetime modes a + c
//     unified — line stays full-bright while held, then decays in lockstep
//     with the cell glow envelope)
const lineOverlay = document.getElementById('line-overlay');
const lineCtx = lineOverlay.getContext('2d');
let lineDpr = 1;

function resizeLineOverlay() {
  lineDpr = Math.max(1, window.devicePixelRatio || 1);
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  lineOverlay.style.width  = cssW + 'px';
  lineOverlay.style.height = cssH + 'px';
  lineOverlay.width  = Math.round(cssW * lineDpr);
  lineOverlay.height = Math.round(cssH * lineDpr);
  refreshSieveRect();
}

// Per-note line state. Mirrors activeMidiNotes' lifecycle but is its own
// array so we can keep drawing fade-out lines after noteoff (matching the
// cell-glow release tail). Each entry carries the gliss interpolation
// parameters so a single line can slide its endpoint between cells.
const lineNotes = [];
// PORTAMENTO_MS_PER_SEMITONE moved to ./js/constants.js (Phase 2.1).

// Cubic smoothstep — the natural ease-in-out curve SWAM Cello's portamento
// traces. Mirrored exactly by drawGlissChain's _glissEase so the white
// triangle leg endpoint and the rolling-score chain plot the SAME Y at
// the same time.
function easeSlide(t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return t * t * (3 - 2 * t);
}

function predictGlissDuration(fromPitch, toPitch, complex) {
  const interval = Math.abs(toPitch - fromPitch);
  if (interval === 0) return 0;          // same-pitch retrigger → instant
  const perSemi = PORTAMENTO_MS_PER_SEMITONE[complex] || 80;
  return Math.min(2000, interval * perSemi);
}

// Compute the displayed pitch of an in-flight line at time `now`. Used by
// startLine to pick the most-accurate fromPitch for a continuing gliss
// (SWAM aborts in-progress slides when a new noteon arrives, retargeting
// from wherever the audible pitch had reached — we mirror that visually).
function _displayedPitch(ln, now) {
  if (ln.animDurMs <= 0) return ln.toPitch;
  const t = Math.min(1, Math.max(0, (now - ln.animStartMs) / ln.animDurMs));
  return ln.fromPitch + (ln.toPitch - ln.fromPitch) * easeSlide(t);
}

// PIZZ_FADE_MIN_MS / PIZZ_FADE_MAX_MS moved to ./js/constants.js (Phase 2.1).

// Find the live (sustaining) gliss line for this voice+complex, if any.
// For gliss complexes, this presence/absence IS the slide-vs-leap
// discriminator: a true slide's overlapping noteons mean the previous
// line is still alive when the new noteon arrives; a leap or voice-steal
// has already issued a clean noteoff, so the line was removed by endLine.
// No auxiliary tracker needed.
//
// UNIFIED CLASSIFIER — the rolling-chain side runs the same live-entry
// check at handleMidiEcho noteon time (storing `chainStart` on the
// event); chain grouping breaks at chainStart=true. Both this function
// and the chain-grouping pass therefore classify the SAME bridge MIDI
// pattern using the SAME signal. If the bridge's LEAP_GAP_MS or
// stealInstance behaviour ever changes such that "live entry at noteon
// time" stops being a reliable slide-vs-leap signal, BOTH paths need a
// coordinated review (search for `chainStart` to find the chain side).
function _findGlissLine(voice, complex) {
  for (let i = lineNotes.length - 1; i >= 0; i--) {
    const ln = lineNotes[i];
    if (ln.isGliss && ln.voice === voice && ln.complex === complex) return ln;
  }
  return null;
}

// True if any active MIDI note for (voice, complex) is currently sounding.
// Called from endLine AFTER handleMidiEcho's queue.shift, so it reflects
// the post-noteoff state — used to decide whether a gliss chain is over.
function _glissStillSounding(voice, complex) {
  for (const queue of activeMidiNotes.values()) {
    for (const evt of queue) {
      if (evt.voice === voice && evt.complex === complex) return true;
    }
  }
  return false;
}

function startLine(voice, pitch, velocity, complex, key) {
  const now = performance.now();

  // === GLISS PATH ===
  // ONE persistent lineNote per (voice, complex) for the lifetime of the
  // gliss chain. Each new noteon either RETARGETS that line's slide
  // (existing line found → it's an overlap = a true slide) or, if no live
  // line exists, STARTS a fresh one with NO ramp time (no live line means
  // either the chain's first noteon or a leap with a clean prior noteoff
  // — both should snap to the new pitch instantly, since there's no
  // audible portamento).
  if (GLISS_COMPLEXES.has(complex)) {
    const existing = _findGlissLine(voice, complex);
    if (existing) {
      // Slide — pitch handoff at the currently-displayed value (mirrors
      // SWAM's portamento-engine retarget: it slides from wherever the
      // audible pitch was at the moment the new noteon arrived).
      const fromPitch = _displayedPitch(existing, now);
      existing.fromPitch  = fromPitch;
      existing.toPitch    = pitch;
      existing.animStartMs = now;
      existing.animDurMs   = predictGlissDuration(fromPitch, pitch, complex);
    } else {
      // Leap or chain-start — instant snap, no animation at all.
      lineNotes.push({
        isGliss: true,
        voice, complex,
        fromPitch: pitch, toPitch: pitch,
        animStartMs: now, animDurMs: 0,
        sustaining: true,
        fadeMs: 0,
        releaseStartMs: 0,
      });
    }
    return;
  }

  // === NON-GLISS PATH ===
  // One lineNote per MIDI noteon; pizz fade only on C1.
  const v = Math.max(0, Math.min(127, +velocity || 0));
  const fadeMs = (complex === 1)
    ? PIZZ_FADE_MIN_MS + (PIZZ_FADE_MAX_MS - PIZZ_FADE_MIN_MS) * Math.min(1, v / 110)
    : 0;
  lineNotes.push({
    isGliss: false,
    voice, complex, key,
    fromPitch: pitch, toPitch: pitch,
    animStartMs: now, animDurMs: 0,
    sustaining: true,
    fadeMs,
    releaseStartMs: 0,
  });
}

function endLine(voice, pitch, complex, key) {
  // === GLISS PATH ===
  // Drop the persistent lineNote ONLY when the chain has truly ended
  // (no more same-voice/same-complex notes sounding). A slide's overlap
  // means one noteoff fires while another noteon is still active, but
  // the line should keep tracking through the full chain.
  if (GLISS_COMPLEXES.has(complex)) {
    if (_glissStillSounding(voice, complex)) return;
    for (let i = 0; i < lineNotes.length; i++) {
      const ln = lineNotes[i];
      if (ln.isGliss && ln.voice === voice && ln.complex === complex) {
        lineNotes.splice(i, 1);
        return;
      }
    }
    return;
  }

  // === NON-GLISS PATH ===
  // Per-noteon match by `key`. C1 fades; everything else snaps off.
  for (let i = 0; i < lineNotes.length; i++) {
    const ln = lineNotes[i];
    if (!ln.isGliss && ln.key === key && ln.voice === voice && ln.sustaining) {
      if (ln.fadeMs > 0) {
        ln.sustaining = false;
        ln.releaseStartMs = performance.now();
      } else {
        lineNotes.splice(i, 1);
      }
      return;
    }
  }
}

function clearAllLines() {
  lineNotes.length = 0;
}

// Sieve strip rect cached per resize. Cell positions interpolate from the
// rect alone (cells distribute uniformly via flex), so we don't pay 49
// getBoundingClientRect calls per frame — just one for the strip on
// layout changes.
let _sieveRect = null;
function refreshSieveRect() {
  const el = document.querySelector('.ovl-sieve-right');
  _sieveRect = el ? el.getBoundingClientRect() : null;
}
window.addEventListener('resize', resizeLineOverlay);
requestAnimationFrame(refreshSieveRect);

function sieveCellLeftEdgePos(pitch) {
  if (!_sieveRect || _sieveRect.height === 0) return null;
  const clamped = Math.max(36, Math.min(84, pitch));
  const i = clamped - 36;       // continuous semitone index 0..48
  return {
    x: _sieveRect.left,
    y: _sieveRect.top + (48.5 - i) * _sieveRect.height / 49,
  };
}

const _projVec = new THREE.Vector3();
function projectWorldToScreen(worldVec) {
  _projVec.copy(worldVec).project(camera);   // NDC: each axis in [-1, 1]
  return {
    x: (_projVec.x * 0.5 + 0.5) * window.innerWidth,
    y: (1 - (_projVec.y * 0.5 + 0.5)) * window.innerHeight,
  };
}

const _kLineWorld = new THREE.Vector3();
const _cLineWorld = new THREE.Vector3();
const _cTmpWorld  = new THREE.Vector3();

function drawLineOverlay() {
  const w = lineOverlay.width;
  const h = lineOverlay.height;
  lineCtx.clearRect(0, 0, w, h);

  if (lineNotes.length === 0) {
    requestAnimationFrame(drawLineOverlay);
    return;
  }

  // Project active K-vertex and the geometrically-nearest ghost C-vertex.
  // Mirrors the kcLine logic in animateCube so the 3D K↔C line and the
  // 2D K→sieve / C→sieve lines all converge at the same K and C points.
  cubeGroup.updateMatrixWorld(true);
  ghostGroup.updateMatrixWorld(true);
  vertexMeshes[currentActiveK].getWorldPosition(_kLineWorld);
  let bestDist2 = Infinity;
  for (let c = 0; c < 8; c++) {
    ghostVertMeshes[c].getWorldPosition(_cTmpWorld);
    const d2 = _kLineWorld.distanceToSquared(_cTmpWorld);
    if (d2 < bestDist2) {
      bestDist2 = d2;
      _cLineWorld.copy(_cTmpWorld);
    }
  }
  const kScreen = projectWorldToScreen(_kLineWorld);
  const cScreen = projectWorldToScreen(_cLineWorld);

  const now = performance.now();
  let toRemove = null;

  lineCtx.lineWidth = 2.2 * lineDpr;
  lineCtx.lineCap = 'round';
  lineCtx.lineJoin = 'round';

  for (let li = 0; li < lineNotes.length; li++) {
    const ln = lineNotes[li];

    // Pizz fade. Other complexes have fadeMs=0 so this branch is a no-op
    // for them (they were already removed by endLine's splice).
    let opacity = 1;
    if (!ln.sustaining) {
      const dt = now - ln.releaseStartMs;
      if (dt >= ln.fadeMs) {
        if (!toRemove) toRemove = [];
        toRemove.push(li);
        continue;
      }
      const fadeT = dt / ln.fadeMs;
      opacity = 1 - fadeT * fadeT;            // ease-out quadratic decay
    }

    // Gliss interpolation with cubic-smoothstep easing — matches a
    // cellist's physical slide curve (slow grip → mid acceleration →
    // settle); duration from predictGlissDuration() so the leg's vertical
    // position matches the audio's portamento at every frame.
    let pitch = ln.toPitch;
    if (ln.animDurMs > 0) {
      const tRaw = (now - ln.animStartMs) / ln.animDurMs;
      const tClamp = Math.min(1, Math.max(0, tRaw));
      pitch = ln.fromPitch + (ln.toPitch - ln.fromPitch) * easeSlide(tClamp);
    }

    const cellPos = sieveCellLeftEdgePos(pitch);
    if (!cellPos) continue;

    const sx = cellPos.x * lineDpr;
    const sy = cellPos.y * lineDpr;
    const kx = kScreen.x * lineDpr, ky = kScreen.y * lineDpr;
    const cx = cScreen.x * lineDpr, cy = cScreen.y * lineDpr;

    lineCtx.strokeStyle = 'rgba(255, 255, 255, ' + opacity.toFixed(3) + ')';

    // Triangle legs are always STRAIGHT — the curve the user wants lives in
    // the rolling-score gliss chain (drawGlissChain), not here.
    lineCtx.beginPath();
    lineCtx.moveTo(kx, ky);
    lineCtx.lineTo(sx, sy);
    lineCtx.stroke();

    lineCtx.beginPath();
    lineCtx.moveTo(cx, cy);
    lineCtx.lineTo(sx, sy);
    lineCtx.stroke();
  }

  if (toRemove) {
    for (let i = toRemove.length - 1; i >= 0; i--) {
      lineNotes.splice(toRemove[i], 1);
    }
  }

  requestAnimationFrame(drawLineOverlay);
}
resizeLineOverlay();
requestAnimationFrame(drawLineOverlay);
// ---- /Triangle leg lines ---------------------------------------------------

function handleMidiEcho(data) {
  if (!data || !data.kind) return;

  if (data.kind === 'panic') {
    activeMidiNotes.clear();
    clearAllGlows();
    clearAllLines();
    return;
  }

  const key = `${data.voice}:${data.pitch}`;

  if (data.kind === 'noteon') {
    // Slide-vs-leap classifier (paired with the white-line's `_findGlissLine`).
    // A true slide's overlapping noteons mean a previous same-(voice, complex)
    // note is still alive when this noteon arrives; a leap or a voice-steal
    // has already issued the noteoff so the queue is empty for this complex.
    // Tag this noteon's `chainStart` so the rolling-chain grouping pass
    // breaks here. Mirrors the white-line's "live entry" semantics exactly,
    // eliminating the GLISS_GAP_MS heuristic's blind spot at sub-25 ms voice
    // steals: the bridge's `stealInstance` emits noteoff(old) → noteon(new)
    // synchronously (gap ≈ 0 ms), which the gap-only test misclassified as
    // a slide and drew as a slant from old's last pitch to new's anchor —
    // visible as "wrong direction" mid-phrase. GLISS_GAP_MS remains as a
    // UDP-reorder fallback only.
    const cmx = data.complex | 0;
    let chainStart = false;
    if (GLISS_COMPLEXES.has(cmx)) {
      chainStart = true;
      outer: for (const q of activeMidiNotes.values()) {
        for (const e of q) {
          if (e.voice === data.voice && e.complex === cmx) { chainStart = false; break outer; }
        }
      }
    }
    startGlow(data.pitch, data.velocity, cmx);
    startLine(data.voice, data.pitch, data.velocity, cmx, key);
    let queue = activeMidiNotes.get(key);
    if (!queue) { queue = []; activeMidiNotes.set(key, queue); }
    queue.push({
      pitch:    data.pitch,
      velocity: data.velocity,
      voice:    data.voice,
      complex:  cmx,
      onsetMs:  performance.now(),
      chainStart,
    });
    return;
  }

  if (data.kind === 'noteoff') {
    const queue = activeMidiNotes.get(key);
    if (!queue || queue.length === 0) return;  // stray noteoff (lost UDP noteon) — skip
    const pending = queue.shift();             // FIFO — oldest noteon pairs first
    if (queue.length === 0) activeMidiNotes.delete(key);
    endGlow(pending.pitch);                    // start cell-glow release
    endLine(pending.voice, pending.pitch, pending.complex, key);
    finishedMidiNotes.push({
      pitch:    pending.pitch,
      velocity: pending.velocity,
      voice:    pending.voice,
      complex:  pending.complex,
      onsetMs:  pending.onsetMs,
      offsetMs: performance.now(),
    });
  }
}

// Watchdog: a stuck active note (UDP loss on the noteoff side, or relay
// reconnect mid-phrase) would otherwise sustain forever on the canvas. After
// PENDING_MAX_AGE_MS we force-finalise the queue's oldest entry so the
// rectangle stops growing. Walks every per-key queue.
setInterval(() => {
  const now = performance.now();
  for (const [key, queue] of activeMidiNotes) {
    while (queue.length > 0 && now - queue[0].onsetMs > PENDING_MAX_AGE_MS) {
      const pending = queue.shift();
      endGlow(pending.pitch);                  // also release the cell glow
      endLine(pending.voice, pending.pitch, pending.complex, key);
      finishedMidiNotes.push({
        pitch:    pending.pitch,
        velocity: pending.velocity,
        voice:    pending.voice,
        complex:  pending.complex,
        onsetMs:  pending.onsetMs,
        offsetMs: now,
      });
    }
    if (queue.length === 0) activeMidiNotes.delete(key);
  }
}, 5000);

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initRollingScore);
} else {
  initRollingScore();
}

// Tilt and spin are derived from gyro quaternion client-side
// (faster than waiting for relay to compute + broadcast at 60Hz)
let prevGyroQuat = [0, 0, 0, 1];
let prevGyroTime = 0;

function computeLocalExpression(gyro) {
  if (!gyro) return;
  const [x, y, z, w] = gyro;
  const now = performance.now();

  // Tilt (pitch angle from quaternion)
  const sinP = 2 * (w * x - y * z);
  const pitch = Math.asin(Math.max(-1, Math.min(1, sinP)));
  const tilt = (pitch + Math.PI / 2) / Math.PI;

  document.getElementById('expr-tilt').textContent = tilt.toFixed(2);
  document.getElementById('expr-tilt-bar').style.width = (tilt * 100) + '%';

  // Spin (angular velocity)
  const dt = (now - prevGyroTime) / 1000;
  if (dt > 0 && dt < 1 && prevGyroTime > 0) {
    const dot = Math.abs(prevGyroQuat[0]*x + prevGyroQuat[1]*y + prevGyroQuat[2]*z + prevGyroQuat[3]*w);
    const angle = 2 * Math.acos(Math.min(1, dot));
    const angularVel = angle / dt;
    const spin = Math.min(1, angularVel / 6);
    document.getElementById('expr-spin').textContent = spin.toFixed(2);
    document.getElementById('expr-spin-bar').style.width = (spin * 100) + '%';
  }

  prevGyroQuat = [x, y, z, w];
  prevGyroTime = now;
}

// ============================================================
// WebSocket — receives state broadcasts from relay
// ============================================================

// ws status indicators were removed from the UI; stub out the refs so the
// existing open/close handlers don't need to branch.
const dot = { classList: { add() {}, remove() {} } };
const wsStatusEl = { set textContent(_v) {} };
let gyroThrottleFrame = null;
let pendingGyroState = null;

// Phase 2.3 — WebSocket transport extracted to ./js/transport.js. The
// transport owns the connection + reconnect loop and emits typed events;
// the wiring below subscribes each event to the dashboard's local
// handlers. `wsSend` is the same name re-exported as a thin alias so
// the rest of dashboard.html (numerous callsites: BLE move forwarding,
// mode toggles, diagram selection, panic, gyro zero) doesn't have to
// rename anything.
const wsSend = transportSend;

transportOn('open', () => {
  dot.classList.add('connected');
  wsStatusEl.textContent = 'connected';
  wsSend({ type: 'get_diagrams' });
});
transportOn('close', () => {
  dot.classList.remove('connected');
  wsStatusEl.textContent = 'reconnecting...';
});
transportOn('state', (data, move) => {
  updateState(data, move);
  updateV2State(data, move);
  // computeLocalExpression runs off gyro_tick only (see that handler).
});
transportOn('gyroState', (data) => {
  pendingGyroState = data;
  if (!gyroThrottleFrame) {
    gyroThrottleFrame = requestAnimationFrame(() => {
      if (pendingGyroState) {
        updateState(pendingGyroState, null);
        updateV2State(pendingGyroState, null);
        pendingGyroState = null;
      }
      gyroThrottleFrame = null;
    });
  }
});
transportOn('gyroTick', (data, dev) => {
  // 60 Hz lightweight pose update from relay's Kalman loop. Skip full
  // state recompute — only refresh gyro-driven visuals.
  const [x, y, z, w] = data;
  currentGyro.set(-x, z, y, w);
  hasGyro = true;
  if (autoZeroPending) {
    gyroZeroInv.copy(currentGyro).invert();
    autoZeroPending = false;
    // Mirror the zero to the relay so the engine's snap cells centre on
    // this rest pose too — otherwise snap thresholds are anchored in the
    // raw sensor frame and feel asymmetric after auto-zero.
    wsSend({ type: 'zero_gyro' });
  }
  if (typeof dev === 'number') {
    const devEl  = document.getElementById('expr-dev');
    const devBar = document.getElementById('expr-dev-bar');
    if (devEl)  devEl.textContent = dev.toFixed(2);
    if (devBar) devBar.style.width = (dev * 100) + '%';
  }
  computeLocalExpression(data);
});
transportOn('diagrams',  populateDiagramSelect);
transportOn('spell',     handleSpellEvent);
transportOn('spellBook', (data) => { spellBook = data; });
transportOn('solve',     handleSolveEvent);
transportOn('midiEcho',  handleMidiEcho);
// Note: the engine's `voice` WS message still fires on every turn
// (powers any listener that wants the archetypal gesture shape), but
// the notation strip no longer consumes it — Phase E tier 2 reads the
// MIDI echo instead so the staff reflects exactly what SWAM plays,
// not what the engine dispatched.

transportConnect();

// ============================================================
// Sequence Control Handlers
// ============================================================

const diagramSelect = document.getElementById('diagram-select');
const pathSelect = document.getElementById('path-select');
const cmodeSelect = document.getElementById('cmode-select');
const resetBtn = document.getElementById('resetBtn');

function populateDiagramSelect(diagrams) {
  // Keep the "direct" option, add diagram options
  while (diagramSelect.options.length > 1) diagramSelect.remove(1);
  for (const d of diagrams) {
    const opt = document.createElement('option');
    opt.value = d.name;
    opt.textContent = `${d.name} (${d.path.length} steps)`;
    diagramSelect.appendChild(opt);
  }
}

diagramSelect.addEventListener('change', () => {
  const name = diagramSelect.value;
  if (name) {
    wsSend({ type: 'set_diagram', name });
  } else {
    wsSend({ type: 'clear_diagram' });
  }
});

pathSelect.addEventListener('change', () => {
  wsSend({ type: 'set_mode', path: pathSelect.value });
});

// Visible path toggle in the State panel. Click flips V1 ↔ V2 via the same
// WS message the hidden pathSelect uses. State updates mirror the new value
// back into #s-path and pathSelect in updateState() so the engine is the
// source of truth (niklas spell can also flip path — see engine.ts).
document.getElementById('s-path').addEventListener('click', () => {
  const cur = document.getElementById('s-path').textContent.trim();
  const next = cur === 'V2' ? 'V1' : 'V2';
  wsSend({ type: 'set_mode', path: next });
});

cmodeSelect.addEventListener('change', () => {
  wsSend({ type: 'set_mode', cCube: cmodeSelect.value });
});

resetBtn.addEventListener('click', () => {
  wsSend({ type: 'reset' });
});
document.getElementById('resetBtnVisible')?.addEventListener('click', async () => {
  // Tell the cube itself "you are now solved" so its internal facelet
  // report re-anchors to reality. Same action as GAN CubeStation's reset.
  // Without this, the FACELETS stream can stay out of phase with the
  // physical cube (e.g. if the cube was moved while disconnected).
  if (activeCube) {
    try {
      await activeCube.sendCubeCommand({ type: 'REQUEST_RESET' });
      lastSolvedReport = true;
      setSolvedBadge(true, false);
    } catch (e) {
      console.warn('Cube REQUEST_RESET failed:', e);
    }
  }
  wsSend({ type: 'reset' });
});

const gyroSmoothSlider = document.getElementById('gyroSmoothing');
const gyroSmoothVal = document.getElementById('gyroSmoothVal');
gyroSmoothSlider.addEventListener('input', () => {
  const val = parseFloat(gyroSmoothSlider.value);
  gyroSmoothVal.textContent = val.toFixed(2);
  wsSend({ type: 'set_gyro_smoothing', value: val });
});

// Rolling-score scroll speed (CSS px / sec). Drives ROLL_PX_PER_SEC.
// Persisted in localStorage. Lower = slower scroll = more history visible
// (notes are wider per ms); higher = faster scroll = sharper temporal feel.
const scoreSpeedSlider = document.getElementById('scoreSpeed');
const scoreSpeedValEl  = document.getElementById('scoreSpeedVal');
function applyScoreSpeed(val) {
  ROLL_PX_PER_SEC = val;
  scoreSpeedValEl.textContent = String(val | 0);
}
const savedScoreSpeed = parseFloat(localStorage.getItem('scoreSpeed'));
if (isFinite(savedScoreSpeed) && savedScoreSpeed >= 60 && savedScoreSpeed <= 900) {
  scoreSpeedSlider.value = String(savedScoreSpeed | 0);
  applyScoreSpeed(savedScoreSpeed);
}
scoreSpeedSlider.addEventListener('input', () => {
  const val = parseFloat(scoreSpeedSlider.value);
  applyScoreSpeed(val);
  localStorage.setItem('scoreSpeed', String(val));
});

// Ghost cube size — uniform scale around origin (cube's center), so the
// ghost can read as "inside" the live cube (<1) or "surrounding" it (>1).
// Persisted in localStorage so the user's chosen size survives reloads.
const ghostSizeSlider = document.getElementById('ghostSize');
const ghostSizeValEl = document.getElementById('ghostSizeVal');
function applyGhostSize(val) {
  ghostGroup.scale.setScalar(val);
  ghostSizeValEl.textContent = val.toFixed(2);
}
const savedGhostSize = parseFloat(localStorage.getItem('ghostSize'));
if (isFinite(savedGhostSize) && savedGhostSize >= 0.2 && savedGhostSize <= 2.5) {
  ghostSizeSlider.value = savedGhostSize.toFixed(2);
  applyGhostSize(savedGhostSize);
} else {
  applyGhostSize(1.0);
}
ghostSizeSlider.addEventListener('input', () => {
  const val = parseFloat(ghostSizeSlider.value);
  applyGhostSize(val);
  localStorage.setItem('ghostSize', val.toFixed(2));
});

// ============================================================
// Cube BLE Connection (Web Bluetooth)
// ============================================================

// #cube-status span was removed; stub so existing assignments don't crash.
const cubeStatus = { set textContent(_v) {}, set className(_v) {} };
const connectBtn = document.getElementById('connectBtn');
const macInput = document.getElementById('macAddress');

// Canonical solved facelets (Kociemba notation: U9 R9 F9 D9 L9 B9).
const SOLVED_FACELETS = 'UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';
// Module-scope handle so the Reset button can reach the connected cube.
let activeCube = null;
let lastSolvedReport = true; // assume connect-time cube is solved

if (localStorage.getItem('ganMacAddress')) {
  macInput.value = localStorage.getItem('ganMacAddress');
}

connectBtn.addEventListener('click', async () => {
  const macAddress = macInput.value.trim().toUpperCase();
  const macRegex = /^([0-9A-F]{2}[:-]){5}([0-9A-F]{2})$/;
  if (!macRegex.test(macAddress)) {
    cubeStatus.textContent = 'invalid MAC';
    cubeStatus.className = 'err';
    return;
  }

  localStorage.setItem('ganMacAddress', macAddress);
  cubeStatus.textContent = 'select cube in popup...';
  cubeStatus.className = '';
  connectBtn.disabled = true;

  try {
    const cube = await connectGanCube(async (device, isFallbackCall) => {
      return macAddress;
    });
    activeCube = cube;

    cubeStatus.textContent = 'connected';
    cubeStatus.className = 'ok';
    connectBtn.textContent = 'Connected';
    connectBtn.classList.add('connected');
    connectBtn.disabled = true;
    applyCubeConnectView();

    // The GAN library emits FACELETS events with `event.facelets` on every
    // move — the authoritative physical cube state, no client-side tracker.
    cube.events$.subscribe((event) => {
      if (event.type === 'MOVE') {
        wsSend({ type: 'move', value: event.move });
      } else if (event.type === 'FACELETS') {
        const solved = event.facelets === SOLVED_FACELETS;
        if (solved && !lastSolvedReport) {
          // Edge fires only through the relay → WS solve message → handleSolveEvent,
          // so the pulse stays in sync with the OSC /xk/solve emit.
          wsSend({ type: 'cube_solved' });
        } else if (!solved && lastSolvedReport) {
          // Unsolved edge — dim badge immediately, no relay round-trip needed.
          setSolvedBadge(false, false);
        }
        lastSolvedReport = solved;
      } else if (event.type === 'GYRO' || event.type === 'GYROSCOPE' || event.gyro) {
        wsSend({ type: 'gyro', data: event.gyro || event });
      } else if (event.type === 'DISCONNECT') {
        activeCube = null;
        cubeStatus.textContent = 'disconnected';
        cubeStatus.className = 'err';
        connectBtn.textContent = 'Connect';
        connectBtn.classList.remove('connected');
        connectBtn.disabled = false;
        revertCubeConnectView();
      }
    });

  } catch (err) {
    console.error('Cube connect error:', err);
    cubeStatus.textContent = 'failed: ' + err.message;
    cubeStatus.className = 'err';
    connectBtn.disabled = false;
  }
});
</script>
